<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบกิจกรรมและการรับสมัคร - สภานักเรียนโรงเรียนคำม่วง</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #F3F4F6; color: #1F2937; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // ⚠️ การตั้งค่าระบบ
        // ==========================================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfq999r-lWQcNZmYZWeUxiWNmNOo5q1MQwU5E7CQruSsBliCPMOueVOoRnw5ElbkFOfQ/exec";
        const GITHUB_PAGES_URL = window.location.origin + window.location.pathname; 
        const HARDCODED_LOGO = "https://i.postimg.cc/wBN5btrp/rong-re-yn-kham-wng.png";
        const HARDCODED_NAME = "STUDENT COUNCIL • KHAMMUANG SCHOOL";

        const FIELD_TYPES = [
            { id: 'text', label: 'คำตอบสั้น', icon: 'ph-text-t' },
            { id: 'longtext', label: 'ย่อหน้า', icon: 'ph-text-align-left' },
            { id: 'radio', label: 'หลายตัวเลือก (เลือก 1)', icon: 'ph-radio-button' },
            { id: 'checkbox', label: 'ช่องทำเครื่องหมาย', icon: 'ph-check-square-offset' },
            { id: 'dropdown', label: 'เลื่อนลง', icon: 'ph-caret-circle-down' },
            { id: 'date', label: 'วันที่', icon: 'ph-calendar-blank' },
            { id: 'time', label: 'เวลา', icon: 'ph-clock' },
            { id: 'scale', label: 'สเกลเชิงเส้น', icon: 'ph-sliders-horizontal' },
            { id: 'file', label: 'อัปโหลดไฟล์', icon: 'ph-upload-simple' }
        ];

        const CATEGORY_OPTIONS = [
            "ทั่วไป/อื่นๆ", "กีฬา", "วิชาการ", "ดนตรี/ศิลปะ", "จิตอาสา", "อบรม/ค่าย", "สภานักเรียน", "ไม่ระบุ (-)"
        ];

        // --- SHARED COMPONENTS ---
        const Header = ({ onAdminTrigger, showBack, onBack }) => {
            const [logoClicks, setLogoClicks] = useState(0);
            const clickTimeoutRef = useRef(null);

            const handleLogoClick = () => {
                setLogoClicks(prev => prev + 1);
                if (clickTimeoutRef.current) clearTimeout(clickTimeoutRef.current);
                clickTimeoutRef.current = setTimeout(() => setLogoClicks(0), 3000);
                if (logoClicks + 1 >= 5) { onAdminTrigger(); setLogoClicks(0); clearTimeout(clickTimeoutRef.current); }
            };

            return (
                <header className="glass-panel border-b border-[#E5E7EB] px-4 py-3 flex justify-between items-center shadow-sm z-40 sticky top-0">
                    <div className="flex items-center gap-3">
                        {showBack && (
                            <button onClick={onBack} className="mr-1 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">
                                <i className="ph ph-caret-left text-lg font-bold"></i>
                            </button>
                        )}
                        <img src={HARDCODED_LOGO} alt="Logo" onClick={handleLogoClick} className="w-10 h-10 rounded-full object-cover border shadow-sm cursor-pointer hover:scale-105 transition-transform" /> 
                        <div className="flex flex-col justify-center">
                            <h1 className="font-bold text-[#1F2937] text-[14px] md:text-[15px] leading-tight mb-0.5">ระบบกิจกรรมและการรับสมัคร</h1>
                            <p className="text-[9px] md:text-[10px] text-[#6B7280] font-medium leading-none tracking-wide">{HARDCODED_NAME}</p>
                        </div>
                    </div>
                </header>
            );
        };

        const CustomAlert = ({ config, onClose }) => {
            if (!config?.isOpen) return null;
            const isError = config.type === 'error';
            const isSuccess = config.type === 'success';
            return (
                <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 modal-overlay animate-in fade-in">
                    <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl text-center animate-in zoom-in-95">
                        <div className={`w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 ${isError ? 'bg-red-50 text-red-600' : isSuccess ? 'bg-green-50 text-green-600' : 'bg-blue-50 text-blue-600'}`}>
                            <i className={`ph text-4xl ${isError ? 'ph-x-circle' : isSuccess ? 'ph-check-circle' : 'ph-info'}`}></i>
                        </div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">{isError ? 'เกิดข้อผิดพลาด' : isSuccess ? 'สำเร็จ' : 'แจ้งเตือน'}</h3>
                        <p className="text-sm text-gray-500 mb-6">{config.message}</p>
                        <button onClick={onClose} className="w-full py-3 bg-gray-900 hover:bg-black text-white font-bold rounded-xl transition-colors shadow-md">ตกลง</button>
                    </div>
                </div>
            );
        };

        // --- PUBLIC VIEWS ---
        const HomeView = ({ navigateTo, events, isLoading }) => (
            <div className="p-4 md:p-6 pb-24 animate-in fade-in duration-300 min-h-screen max-w-2xl mx-auto w-full">
                <div className="bg-gradient-to-br from-[#C8102E] to-[#881337] rounded-3xl p-6 text-white shadow-[0_8px_30px_rgb(200,16,46,0.3)] mb-8 relative overflow-hidden">
                    <div className="absolute right-0 top-0 text-white/10 rotate-12 transform scale-150 pointer-events-none translate-x-4 -translate-y-4"><i className="ph ph-calendar-star text-[140px]"></i></div>
                    <div className="relative z-10">
                        <span className="inline-block px-3 py-1 bg-white/20 backdrop-blur-sm rounded-full text-xs font-bold mb-3 border border-white/30">STUDENT COUNCIL</span>
                        <h2 className="text-2xl font-bold mb-2">ค้นพบกิจกรรมที่ใช่สำหรับคุณ</h2>
                        <p className="text-[#FFE4E6] text-sm leading-relaxed opacity-95 max-w-[85%]">ติดตามข่าวสาร ลงทะเบียนเข้าร่วมกิจกรรม และเป็นส่วนหนึ่งของการขับเคลื่อนโรงเรียนของเรา</p>
                    </div>
                </div>

                <h3 className="text-lg font-bold text-[#1F2937] flex items-center gap-2 mb-4"><i className="ph ph-fire text-[#C8102E] text-[20px] ph-fill"></i> กิจกรรมทั้งหมด</h3>

                {isLoading ? (
                    <div className="text-center p-8 text-gray-400 animate-pulse"><i className="ph ph-spinner-gap animate-spin text-4xl mb-2"></i><p>กำลังโหลดข้อมูล...</p></div>
                ) : (
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pb-8">
                        {events?.map(event => (
                            <div key={event.id} onClick={() => navigateTo('event-detail', event.slug)} className="bg-white rounded-2xl border border-[#E5E7EB] overflow-hidden shadow-sm hover:shadow-md transition-all cursor-pointer group flex flex-col active:scale-[0.98] h-full">
                                <div className="h-40 md:h-48 shrink-0 relative overflow-hidden bg-gray-100">
                                    <img src={event.image || 'https://via.placeholder.com/400x300?text=No+Image'} alt={event.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                    <div className="absolute top-3 left-3">
                                        {event.status === 'open' ? (
                                            <span className="bg-[#16A34A] text-white px-2.5 py-1 rounded-lg text-xs font-bold shadow-sm flex items-center gap-1"><i className="ph ph-check-circle"></i> เปิดรับสมัคร</span>
                                        ) : (
                                            <span className="bg-gray-800 text-white px-2.5 py-1 rounded-lg text-xs font-bold shadow-sm flex items-center gap-1"><i className="ph ph-lock-key"></i> ปิดรับสมัคร</span>
                                        )}
                                    </div>
                                </div>
                                <div className="p-4 flex flex-col flex-1">
                                    <div className="flex items-center gap-2 mb-1.5"><span className="text-[10px] font-bold text-[#C8102E] bg-red-50 px-2 py-0.5 rounded border border-red-100">{event.type === 'ไม่ระบุ (-)' ? 'กิจกรรม' : event.type || 'กิจกรรม'}</span></div>
                                    <h4 className="font-bold text-gray-800 text-base line-clamp-2 mb-2 group-hover:text-[#C8102E] transition-colors">{event.title}</h4>
                                    <div className="space-y-1.5 mt-auto">
                                        <p className="text-xs text-gray-500 flex items-center gap-1.5"><i className="ph ph-calendar-blank text-[#C8102E]"></i> {event.date || '-'}</p>
                                        <p className="text-xs text-gray-500 flex items-center gap-1.5"><i className="ph ph-map-pin text-[#C8102E]"></i> <span className="truncate">{event.location || '-'}</span></p>
                                    </div>
                                </div>
                            </div>
                        ))}
                        {(!events || events.length === 0) && <div className="col-span-full text-center p-8 bg-white border border-dashed rounded-2xl text-gray-500"><i className="ph ph-calendar-x text-4xl mb-2 text-gray-300"></i><p>ยังไม่มีกิจกรรมในขณะนี้</p></div>}
                    </div>
                )}
            </div>
        );

        const EventDetailView = ({ event, navigateTo, getApplicantCount }) => {
            const [copied, setCopied] = useState(false);
            if (!event) return <div className="p-8 text-center text-gray-500">ไม่พบข้อมูลกิจกรรม</div>;

            const shareUrl = `${GITHUB_PAGES_URL}?event=${event.slug}`;
            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(shareUrl)}&margin=10`;
            const currentCount = getApplicantCount(event.id);
            const isFull = event.capacity && parseInt(event.capacity) > 0 && currentCount >= parseInt(event.capacity);

            const handleShare = () => {
                if (navigator.share) navigator.share({ title: event.title, text: `เชิญร่วมกิจกรรม: ${event.title}`, url: shareUrl }).catch(()=>{});
                else { navigator.clipboard.writeText(shareUrl); setCopied(true); setTimeout(() => setCopied(false), 2000); }
            };

            const formatDisplayDate = (dStr) => {
                if (!dStr) return '-';
                try {
                    const d = new Date(dStr);
                    if (isNaN(d.getTime())) return dStr;
                    return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                } catch(e) { return dStr; }
            }

            return (
                <div className="pb-24 animate-in fade-in bg-white min-h-screen max-w-2xl mx-auto w-full relative">
                    <div className="relative h-64 md:h-80 w-full bg-gray-900 shrink-0">
                        <img src={event.image || 'https://via.placeholder.com/800x400'} alt={event.title} className="w-full h-full object-cover opacity-80" />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                        <div className="absolute bottom-4 left-4 right-4 text-white">
                            <span className="inline-block px-2.5 py-1 bg-[#C8102E] rounded-md text-[10px] font-bold mb-2">{event.type === 'ไม่ระบุ (-)' ? 'กิจกรรม' : event.type || 'กิจกรรม'}</span>
                            <h2 className="text-2xl font-bold leading-tight">{event.title}</h2>
                        </div>
                    </div>

                    <div className="p-5 md:p-8">
                        <div className="flex gap-2 mb-6 border-b pb-6">
                            <button onClick={handleShare} className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl flex items-center justify-center gap-2 transition-colors">
                                {copied ? <><i className="ph ph-check text-green-600 text-lg"></i> คัดลอกแล้ว</> : <><i className="ph ph-share-network text-lg"></i> แชร์กิจกรรม</>}
                            </button>
                            <a href={qrCodeUrl} download={`QR_${event.slug}.png`} target="_blank" className="w-12 h-12 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl flex items-center justify-center transition-colors"><i className="ph ph-qr-code text-2xl"></i></a>
                        </div>

                        <div className="grid grid-cols-2 gap-3 mb-6">
                            <div className="bg-[#F9FAFB] p-3 rounded-xl border flex gap-3 items-start"><div className="bg-red-50 text-[#C8102E] p-2 rounded-lg mt-0.5"><i className="ph ph-calendar-blank text-xl"></i></div><div><p className="text-[10px] text-gray-500 font-bold">วันที่จัดกิจกรรม</p><p className="text-xs font-bold text-gray-800">{event.date || '-'}</p></div></div>
                            <div className="bg-[#F9FAFB] p-3 rounded-xl border flex gap-3 items-start"><div className="bg-red-50 text-[#C8102E] p-2 rounded-lg mt-0.5"><i className="ph ph-clock text-xl"></i></div><div><p className="text-[10px] text-gray-500 font-bold">เวลา</p><p className="text-xs font-bold text-gray-800">{event.time || '-'}</p></div></div>
                            <div className="bg-[#F9FAFB] p-3 rounded-xl border flex gap-3 items-start col-span-2"><div className="bg-red-50 text-[#C8102E] p-2 rounded-lg mt-0.5"><i className="ph ph-map-pin text-xl"></i></div><div><p className="text-[10px] text-gray-500 font-bold">สถานที่</p><p className="text-xs font-bold text-gray-800">{event.location || '-'}</p></div></div>
                        </div>

                        <div className="mb-8">
                            <h3 className="font-bold text-lg mb-3 flex items-center gap-2"><i className="ph ph-info text-[#C8102E]"></i> รายละเอียดกิจกรรม</h3>
                            <p className="text-sm text-gray-600 leading-relaxed whitespace-pre-line">{event.details || '-'}</p>
                        </div>

                        <div className="bg-gray-50 rounded-2xl p-4 border text-sm text-gray-600 mb-8 space-y-2">
                            <div className="flex justify-between"><span className="font-medium text-gray-500">วันเปิดรับสมัคร:</span> <span className="font-bold text-gray-800">{formatDisplayDate(event.openDate)}</span></div>
                            <div className="flex justify-between"><span className="font-medium text-gray-500">วันปิดรับสมัคร:</span> <span className="font-bold text-gray-800">{formatDisplayDate(event.closeDate)}</span></div>
                            <div className="flex justify-between"><span className="font-medium text-gray-500">รับจำนวนจำกัด:</span> <span className={`font-bold ${isFull ? 'text-red-500' : 'text-green-600'}`}>{currentCount}/{event.capacity || 'ไม่จำกัด'} คน</span></div>
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-4 glass-panel border-t shadow-lg z-50">
                        <div className="max-w-2xl mx-auto w-full">
                            {event.status === 'open' && !isFull ? (
                                <button onClick={() => navigateTo('register', event.slug)} className="w-full bg-[#C8102E] hover:bg-[#a10d25] text-white font-bold py-3.5 md:py-4 rounded-xl shadow-md flex justify-center items-center gap-2 transition-colors">
                                    <i className="ph ph-note-pencil text-xl"></i> ไปที่แบบฟอร์มรับสมัคร
                                </button>
                            ) : (
                                <button disabled className="w-full bg-gray-200 text-gray-500 font-bold py-3.5 md:py-4 rounded-xl flex justify-center items-center gap-2 cursor-not-allowed">
                                    <i className="ph ph-lock-key text-xl"></i> {isFull ? 'กิจกรรมนี้มีผู้สมัครเต็มแล้ว' : 'ปิดรับสมัครแล้ว'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const RegisterView = ({ event, navigateTo, onSubmit, setGlobalLoading }) => {
            const [formData, setFormData] = useState({});
            const [errors, setErrors] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);

            if (!event || !event.formFields) return null;

            const handleInputChange = (fieldLabel, value, isCheckbox = false) => {
                if (isCheckbox) {
                    const current = formData[fieldLabel] || [];
                    const updated = current.includes(value) ? current.filter(v => v !== value) : [...current, value];
                    setFormData({ ...formData, [fieldLabel]: updated });
                } else {
                    setFormData({ ...formData, [fieldLabel]: value });
                }
                if (errors[fieldLabel]) setErrors({ ...errors, [fieldLabel]: null });
            };

            const handleFileUpload = (fieldLabel, e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) { setErrors({ ...errors, [fieldLabel]: 'ไฟล์มีขนาดใหญ่เกิน 5MB' }); e.target.value = null; return; }

                const reader = new FileReader();
                reader.onloadend = () => { setFormData({ ...formData, [fieldLabel]: reader.result }); if (errors[fieldLabel]) setErrors({ ...errors, [fieldLabel]: null }); };
                reader.readAsDataURL(file);
            };

            const handleSubmit = async () => {
                const newErrors = {};
                event.formFields?.forEach(f => {
                    if (f.required) {
                        const val = formData[f.label];
                        if (val === undefined || val === null || val === '' || (Array.isArray(val) && val.length === 0)) {
                            newErrors[f.label] = 'กรุณากรอกข้อมูลนี้ / โปรดระบุข้อมูลให้ครบ';
                        }
                    }
                });
                if (Object.keys(newErrors).length > 0) { setErrors(newErrors); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }

                setIsSubmitting(true);
                setGlobalLoading(true); // เปิดเส้นโหลดด้านบน
                await onSubmit({ eventId: event.id, answers: formData });
                setIsSubmitting(false);
                setGlobalLoading(false);
            };

            return (
                <div className="p-4 md:p-8 py-6 bg-white min-h-screen pb-24 animate-in fade-in max-w-2xl mx-auto w-full relative">
                    <div className="mb-6 bg-red-50 p-5 rounded-2xl border border-red-100">
                        <span className="text-xs font-bold text-[#C8102E] uppercase tracking-wider bg-white px-2 py-1 rounded shadow-sm">แบบฟอร์มรับสมัคร</span>
                        <h2 className="text-xl font-bold text-gray-800 leading-tight mt-3">{event.title}</h2>
                        <p className="text-sm text-gray-600 mt-2">โปรดกรอกข้อมูลตามความเป็นจริงให้ครบถ้วน</p>
                    </div>

                    <div className="space-y-6">
                        {event.formFields?.map((field, idx) => (
                            <div key={idx} className={`bg-[#F9FAFB] p-5 md:p-6 rounded-2xl border transition-all ${errors[field.label] ? 'border-red-400 bg-red-50/30' : 'border-gray-200 hover:border-gray-300'}`}>
                                <div className="mb-3">
                                    <label className="block font-bold text-gray-800 text-sm md:text-base">
                                        {field.label} {field.required && <span className="text-[#C8102E] text-lg leading-none">*</span>}
                                    </label>
                                    {field.description && <p className="text-xs text-gray-500 mt-1 leading-relaxed">{field.description}</p>}
                                </div>
                                
                                {field.type === 'text' && <input type="text" value={formData[field.label] || ''} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-full p-3.5 rounded-xl border focus:border-[#C8102E] outline-none shadow-sm" />}
                                {field.type === 'longtext' && <textarea value={formData[field.label] || ''} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-full p-3.5 rounded-xl border focus:border-[#C8102E] outline-none min-h-[100px] shadow-sm"></textarea>}
                                {field.type === 'dropdown' && (
                                    <div className="relative">
                                        <select value={formData[field.label] || ''} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-full p-3.5 rounded-xl border focus:border-[#C8102E] outline-none bg-white appearance-none shadow-sm cursor-pointer">
                                            <option value="" disabled>-- เลือกคำตอบ --</option>
                                            {(field.options || []).map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
                                        </select>
                                        <i className="ph ph-caret-down absolute right-4 top-4 text-gray-400 pointer-events-none"></i>
                                    </div>
                                )}
                                {(field.type === 'radio' || field.type === 'checkbox') && (
                                    <div className="flex flex-col gap-3">
                                        {(field.options || []).map((opt, i) => (
                                            <label key={i} className="flex items-start gap-3 cursor-pointer group">
                                                <div className="mt-0.5"><input type={field.type} name={field.label} value={opt} checked={field.type==='radio' ? formData[field.label]===opt : (formData[field.label]||[]).includes(opt)} onChange={(e) => handleInputChange(field.label, e.target.value, field.type==='checkbox')} className="w-5 h-5 accent-[#C8102E] cursor-pointer" /></div>
                                                <span className="text-sm font-medium text-gray-700 group-hover:text-black">{opt}</span>
                                            </label>
                                        ))}
                                    </div>
                                )}
                                {field.type === 'date' && <input type="date" value={formData[field.label] || ''} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-full p-3.5 rounded-xl border focus:border-[#C8102E] outline-none shadow-sm bg-white cursor-pointer max-w-xs" />}
                                {field.type === 'time' && <input type="time" value={formData[field.label] || ''} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-full p-3.5 rounded-xl border focus:border-[#C8102E] outline-none shadow-sm bg-white cursor-pointer max-w-xs" />}
                                {field.type === 'scale' && (
                                    <div className="bg-white p-4 rounded-xl border shadow-sm">
                                        <div className="flex justify-between text-xs text-gray-500 mb-3 font-bold px-2"><span>{field.scaleMinLabel || 'น้อย'}</span><span>{field.scaleMaxLabel || 'มาก'}</span></div>
                                        <div className="flex justify-between items-center px-2">

                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-4 glass-panel border-t z-50 flex gap-3">

                            <button onClick={handleSubmit} disabled={isSubmitting} className="w-2/3 bg-[#C8102E] hover:bg-[#a10d25] text-white font-bold py-3.5 md:py-4 rounded-xl shadow-md disabled:bg-gray-400 flex items-center justify-center gap-2 transition-colors">
                                {isSubmitting ? <><i className="ph ph-spinner-gap animate-spin text-xl"></i> กำลังส่ง...</> : 'ยืนยันการสมัคร'}

                    </div>
                </div>
            );

        const SuccessRegistrationView = ({ navigateTo }) => (
            <div className="flex flex-col items-center justify-center min-h-screen px-6 text-center animate-in zoom-in-95 max-w-lg mx-auto w-full pb-20">
                <div className="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center text-green-600 mx-auto mb-6 shadow-inner"><i className="ph ph-check-circle text-[60px] ph-fill"></i></div>
                <h2 className="text-3xl font-bold mb-3 text-gray-800">ส่งข้อมูลสำเร็จ!</h2>
                <p className="text-gray-500 mb-10 text-sm leading-relaxed">ระบบได้รับข้อมูลการสมัครของคุณเรียบร้อยแล้ว<br/>ขอบคุณที่ให้ความสนใจเข้าร่วมกิจกรรมของเรา</p>
                <button onClick={() => navigateTo('home')} className="w-full bg-gray-900 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-black transition-colors flex items-center justify-center gap-2">
                    <i className="ph ph-house text-xl"></i> กลับสู่หน้ากิจกรรมทั้งหมด
                </button>
            </div>
        );

        // --- ADMIN VIEWS ---
        const AdminDashboard = ({ onLogout, events, applicants, showAlert, fetchApi, setGlobalLoading }) => {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedEventId, setSelectedEventId] = useState('all');
            
            const [isCreating, setIsCreating] = useState(false);
            const [isEditing, setIsEditing] = useState(false);

            const [passwords, setPasswords] = useState({ oldPass: '', newPass: '' });
            
            const defaultEvent = { title:'', type:'ทั่วไป/อื่นๆ', details:'', date:'', time:'', location:'', image:'', capacity:'', openDate:'', closeDate:'', formFields: [{id: 1, label: 'ชื่อ-นามสกุล', description: '', type: 'text', required: true}] };
            const [newEvent, setNewEvent] = useState(defaultEvent);

            const updateFieldType = (idx, type) => {
                let nf = [...(newEvent.formFields || [])];
                nf[idx].type = type;
                if (['dropdown', 'radio', 'checkbox'].includes(type) && !nf[idx].options) nf[idx].options = ['ตัวเลือก 1'];
                if (type === 'scale') { nf[idx].scaleMin = 1; nf[idx].scaleMax = 5; nf[idx].scaleMinLabel = 'น้อย'; nf[idx].scaleMaxLabel = 'มาก'; }
                setNewEvent({...newEvent, formFields: nf});
            }
            const addOptionToField = (fieldIdx) => { let nf = [...newEvent.formFields]; nf[fieldIdx].options.push(`ตัวเลือก ${nf[fieldIdx].options.length + 1}`); setNewEvent({...newEvent, formFields: nf}); }
            const updateOptionText = (fieldIdx, optIdx, val) => { let nf = [...newEvent.formFields]; nf[fieldIdx].options[optIdx] = val; setNewEvent({...newEvent, formFields: nf}); }
            const removeOption = (fieldIdx, optIdx) => { let nf = [...newEvent.formFields]; nf[fieldIdx].options.splice(optIdx, 1); setNewEvent({...newEvent, formFields: nf}); }
            const removeField = (fieldIdx) => { let nf = [...newEvent.formFields]; nf.splice(fieldIdx, 1); setNewEvent({...newEvent, formFields: nf}); }

            const handleSaveEvent = async () => {
                if(!newEvent.title || !newEvent.date) return showAlert('กรุณากรอกชื่อกิจกรรมและวันที่ให้ครบถ้วน', 'error');
                
                setGlobalLoading(true);
                let payload;
                if (isEditing) {
                    payload = { action: 'updateEvent', event: newEvent };
                } else {
                    const eventId = `EVT-${Math.floor(Math.random() * 10000)}`;
                    const slug = newEvent.title.toLowerCase().replace(/[^a-z0-9ก-๙]+/g, '-').replace(/(^-|-$)+/g, '') + '-' + Math.floor(Math.random()*100);
                    payload = { action: 'createEvent', event: { ...newEvent, id: eventId, slug, status: 'open' } };
                }
                
                const res = await fetchApi(payload);
                setGlobalLoading(false);
                if (res.status === 'success') { showAlert('บันทึกสำเร็จ!', 'success'); setIsCreating(false); setIsEditing(false); setNewEvent(defaultEvent); }
            };

            const openEditMode = (event) => {
                setNewEvent({...event, formFields: event.formFields || []});
                setIsEditing(true);
                setIsCreating(true);
            };

            const toggleStatus = async (eventId, currentStatus) => {
                const newStatus = currentStatus === 'open' ? 'closed' : 'open';
                setGlobalLoading(true);
                await fetchApi({ action: 'toggleEventStatus', eventId, status: newStatus });
                setGlobalLoading(false);
            };
            
            const handleDeleteEvent = async (eventId) => {
                if(confirm("คุณแน่ใจหรือไม่ที่จะลบกิจกรรมนี้? ข้อมูลจะไม่สามารถกู้คืนได้")) {
                    setGlobalLoading(true);
                    const res = await fetchApi({ action: 'deleteEvent', eventId });
                    setGlobalLoading(false);
                    if(res.status === 'success') showAlert('ลบสำเร็จ', 'success');
                }
            };

            const handleChangePassword = async (e) => {
                e.preventDefault();
                if(passwords.newPass.length < 8) return showAlert('รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัว', 'error');
                setGlobalLoading(true);
                const res = await fetchApi({ action: 'changePassword', oldPassword: passwords.oldPass, newPassword: passwords.newPass });
                setGlobalLoading(false);
                if(res.status === 'success') { showAlert('เปลี่ยนรหัสผ่านสำเร็จ', 'success'); setPasswords({oldPass:'', newPass:''}); }
                else showAlert(res.message || 'รหัสเดิมไม่ถูกต้อง', 'error');
            };

            const exportCSV = () => {
                const filtered = applicants.filter(a => selectedEventId === 'all' || a.eventId === selectedEventId);
                if (filtered.length === 0) return showAlert('ไม่มีข้อมูลให้ Export', 'error');
                
                let headers = new Set(["Timestamp", "EventTitle"]);
                filtered.forEach(a => Object.keys(a.answers).forEach(k => headers.add(k)));
                headers = Array.from(headers);

                let csvContent = "data:text/csv;charset=utf-8,\uFEFF" + headers.join(",") + "\n"; 
                filtered.forEach(a => {
                    const evtTitle = events?.find(e=>e.id === a.eventId)?.title || '';
                    let row = [a.timestamp, `"${evtTitle}"`];
                    headers.slice(2).forEach(h => {
                        let val = a.answers[h] || "";
                        if (Array.isArray(val)) val = val.join(" / ");
                        if (typeof val === 'string' && val.startsWith('http')) val = `"${val}"`; 
                        row.push(`"${String(val).replace(/"/g, '""')}"`);
                    });
                    csvContent += row.join(",") + "\n";
                });
                const link = document.createElement("a"); link.setAttribute("href", encodeURI(csvContent)); link.setAttribute("download", `Applicants_${selectedEventId}_${Date.now()}.csv`); document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

                            <button onClick={()=>setActiveTab('settings')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-bold transition-all ${activeTab==='settings'?'bg-[#C8102E] text-white shadow-md':'text-gray-600 hover:bg-gray-50'}`}><i className="ph ph-gear text-lg"></i> ตั้งค่า</button>
                        </div>
                        <div className="mt-auto p-4 border-t">

                        </div>
                    </div>

                    <div className="flex-1 flex flex-col h-full overflow-hidden">
                        <div className="bg-white px-4 py-3 border-b flex justify-between items-center shadow-sm md:hidden">
                            <div className="font-bold text-[#C8102E] flex items-center gap-2"><img src={HARDCODED_LOGO} className="w-8 h-8 rounded-full border shrink-0" /> Admin Panel</div>
                            <button onClick={onLogout} className="bg-gray-100 px-3 py-1.5 rounded-lg text-xs font-bold text-gray-700">ออกระบบ</button>
                        </div>
                        
                        <div className="bg-white border-b px-2 flex md:hidden overflow-x-auto hide-scrollbar z-10">
                            {['overview', 'events', 'applicants', 'settings'].map(tab => (
                                <button key={tab} onClick={()=>setActiveTab(tab)} className={`px-4 py-3 text-sm font-bold border-b-2 whitespace-nowrap transition-colors ${activeTab===tab?'border-[#C8102E] text-[#C8102E]':'border-transparent text-gray-500'}`}>
                                    {tab === 'overview' ? 'ภาพรวม' : tab === 'events' ? 'กิจกรรม' : tab === 'applicants' ? 'รายชื่อ' : 'ตั้งค่า'}
                                </button>
                            ))}
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 md:p-8 bg-gray-50">
                            
                            {/* OVERVIEW TAB */}
                            {activeTab === 'overview' && (
                                <div className="max-w-5xl mx-auto animate-in fade-in space-y-6">
                                    <h2 className="font-bold text-xl text-gray-800">แดชบอร์ดภาพรวม</h2>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="bg-white p-5 rounded-2xl border shadow-sm border-l-4 border-l-blue-500">
                                            <p className="text-sm text-gray-500 font-bold mb-1">กิจกรรมทั้งหมด</p>
                                            <p className="font-bold text-3xl">{events?.length || 0}</p>
                                        </div>
                                        <div className="bg-white p-5 rounded-2xl border shadow-sm border-l-4 border-l-green-500">
                                            <p className="text-sm text-gray-500 font-bold mb-1 text-green-600">เปิดรับอยู่</p>

                                        <div className="overflow-x-auto">

                                                            <img src={e.image || 'https://via.placeholder.com/400x200'} className="w-full h-full object-cover" />
                                                            <span className={`absolute top-3 right-3 px-2 py-1 rounded-md text-[10px] font-bold text-white shadow-sm ${e.status==='open'?'bg-green-500':'bg-gray-700'}`}>{e.status==='open'?'เปิดรับ':'ปิดรับ'}</span>

                                                                <p className="text-[10px] text-gray-500 mb-3 flex items-center gap-1"><i className="ph ph-users"></i> ผู้สมัคร: {applicants?.filter(a=>a.eventId===e.id).length} / {e.capacity||'∞'}</p>
                                                            </div>

                                                                <button onClick={()=>toggleStatus(e.id, e.status)} className={`w-full py-2 rounded-lg text-xs font-bold transition-colors ${e.status==='open'?'bg-red-50 text-red-600 hover:bg-red-100':'bg-green-50 text-green-600 hover:bg-green-100'}`}>
                                                                    {e.status==='open' ? 'ปิดรับสมัคร' : 'เปิดรับสมัคร'}
                                                                </button>
                                                                <div className="flex gap-2">
                                                                    <button onClick={()=>openEditMode(e)} className="flex-1 py-2 bg-gray-100 text-gray-600 rounded-lg text-xs font-bold hover:bg-gray-200"><i className="ph ph-pencil-simple"></i> แก้ไข</button>
                                                                    <button onClick={()=>handleDeleteEvent(e.id)} className="flex-1 py-2 bg-gray-100 text-gray-600 rounded-lg text-xs font-bold hover:bg-red-50 hover:text-red-500"><i className="ph ph-trash"></i> ลบ</button>
                                                                </div>
                                                            </div>
                                                        </div>

                                                {(!events || events.length === 0) && <div className="col-span-full p-10 text-center border-2 border-dashed rounded-2xl text-gray-500">ยังไม่มีกิจกรรม ลองกดสร้างกิจกรรมใหม่ดูสิ!</div>}

                                                <h3 className="font-bold text-xl mb-1 text-gray-800 flex items-center gap-2"><i className="ph ph-calendar-plus text-[#C8102E]"></i> {isEditing ? 'แก้ไขกิจกรรม' : 'สร้างกิจกรรมใหม่'}</h3>
                                                <p className="text-sm text-gray-500 border-b pb-4">กรอกรายละเอียดกิจกรรมและสร้างฟอร์มรับสมัคร</p>

                                                    <div>

                                                    <div className="md:col-span-2"><label className="text-sm font-bold text-gray-700 mb-1 block">รายละเอียด</label><textarea rows="3" value={newEvent.details} onChange={e=>setNewEvent({...newEvent, details: e.target.value})} className="w-full border p-3 rounded-xl focus:border-[#C8102E] outline-none bg-gray-50"></textarea></div>

                                                    <div><label className="text-sm font-bold text-gray-700 mb-1 block">เวลา</label><input type="text" value={newEvent.time} placeholder="เช่น 09:00 - 12:00" onChange={e=>setNewEvent({...newEvent, time: e.target.value})} className="w-full border p-3 rounded-xl focus:border-[#C8102E] outline-none bg-gray-50" /></div>
                                                    
                                                    <div><label className="text-sm font-bold text-gray-700 mb-1 block">วันเปิดรับสมัคร (เริ่ม)</label><input type="date" value={newEvent.openDate} onChange={e=>setNewEvent({...newEvent, openDate: e.target.value})} className="w-full border p-3 rounded-xl focus:border-[#C8102E] outline-none bg-gray-50 cursor-pointer" /></div>
                                                    <div><label className="text-sm font-bold text-gray-700 mb-1 block">วันปิดรับสมัคร (สิ้นสุด)</label><input type="date" value={newEvent.closeDate} onChange={e=>setNewEvent({...newEvent, closeDate: e.target.value})} className="w-full border p-3 rounded-xl focus:border-[#C8102E] outline-none bg-gray-50 cursor-pointer" /></div>
                                                    
                                                    <div><label className="text-sm font-bold text-gray-700 mb-1 block">สถานที่</label><input type="text" value={newEvent.location} onChange={e=>setNewEvent({...newEvent, location: e.target.value})} className="w-full border p-3 rounded-xl focus:border-[#C8102E] outline-none bg-gray-50" /></div>
                                                    <div><label className="text-sm font-bold text-gray-700 mb-1 block">URL รูปภาพหน้าปก</label><input type="text" value={newEvent.image} placeholder="ใส่ลิงก์รูปภาพ (https://...)" onChange={e=>setNewEvent({...newEvent, image: e.target.value})} className="w-full border p-3 rounded-xl focus:border-[#C8102E] outline-none bg-gray-50" /></div>
                                                </div>
                                            </div>
                                            
                                            <div className="space-y-4 pt-4 border-t">
                                                <h4 className="font-bold text-[#C8102E] bg-red-50 inline-block px-3 py-1 rounded-lg text-sm">2. สร้างแบบฟอร์มรับสมัคร</h4>
                                                
                                                <div className="space-y-6">
                                                    {(newEvent.formFields || []).map((f, idx) => (
                                                        <div key={idx} className="p-5 bg-white border border-gray-200 rounded-2xl shadow-sm relative group hover:border-[#C8102E] transition-colors">
                                                            {(newEvent.formFields || []).length > 1 && (
                                                                <button onClick={()=>removeField(idx)} className="absolute -top-3 -right-3 w-8 h-8 bg-white border text-gray-400 hover:text-red-500 rounded-full flex items-center justify-center shadow-sm z-10"><i className="ph ph-x font-bold"></i></button>
                                                            )}
                                                            <div className="flex flex-col md:flex-row gap-4 items-start md:items-center mb-2">
                                                                <input type="text" placeholder="คำถาม" value={f.label} onChange={e=>{let nf=[...(newEvent.formFields||[])]; nf[idx].label=e.target.value; setNewEvent({...newEvent, formFields: nf})}} className="flex-1 p-3 bg-gray-50 border-b-2 border-gray-300 focus:border-[#C8102E] focus:bg-white outline-none font-bold text-gray-800 w-full rounded-t-lg" />
                                                                <div className="relative w-full md:w-auto min-w-[200px]">
                                                                    <select value={f.type} onChange={e=>updateFieldType(idx, e.target.value)} className="w-full p-3 border rounded-xl text-sm bg-white outline-none cursor-pointer appearance-none shadow-sm pr-10 font-medium">
                                                                        {FIELD_TYPES.map(type => <option key={type.id} value={type.id}>{type.label}</option>)}
                                                                    </select>
                                                                    <i className={`ph ${FIELD_TYPES.find(t=>t.id===f.type)?.icon} absolute right-4 top-3.5 text-gray-500 text-lg pointer-events-none`}></i>
                                                                </div>
                                                            </div>

                                                            <input 
                                                                type="text" 
                                                                placeholder="คำอธิบายเพิ่มเติม (ไม่บังคับ) เช่น ระบุไซส์เสื้อ, ไม่ต้องใส่คำนำหน้า" 
                                                                value={f.description || ''} 
                                                                onChange={e=>{let nf=[...(newEvent.formFields||[])]; nf[idx].description=e.target.value; setNewEvent({...newEvent, formFields: nf})}} 
                                                                className="w-full p-2 mb-4 text-xs bg-transparent border-b border-dashed border-gray-300 focus:border-[#C8102E] outline-none text-gray-500" 
                                                            />
                                                            
                                                            {['dropdown', 'radio', 'checkbox'].includes(f.type) && (
                                                                <div className="pl-2 space-y-3 mt-4">
                                                                    {(f.options||[]).map((opt, optIdx) => (
                                                                        <div key={optIdx} className="flex gap-3 items-center">
                                                                            <i className={`text-gray-400 text-lg ${f.type==='radio'?'ph-circle':f.type==='checkbox'?'ph-square':'ph-list'}`}></i>
                                                                            <input type="text" value={opt} onChange={e=>updateOptionText(idx, optIdx, e.target.value)} className="flex-1 border-b p-2 text-sm outline-none focus:border-[#C8102E]" placeholder={`ตัวเลือกที่ ${optIdx+1}`} />
                                                                            {(f.options||[]).length > 1 && <button onClick={()=>removeOption(idx, optIdx)} className="text-gray-400 hover:text-red-500"><i className="ph ph-x"></i></button>}
                                                                        </div>
                                                                    ))}
                                                                    <button onClick={()=>addOptionToField(idx)} className="text-sm font-bold text-[#C8102E] hover:underline mt-2 flex items-center gap-1 ml-7"><i className="ph ph-plus"></i> เพิ่มตัวเลือก</button>
                                                                </div>
                                                            )}

                                                            {f.type === 'scale' && (
                                                                <div className="flex flex-col gap-4 mt-4 bg-gray-50 p-4 rounded-xl border">
                                                                    <div className="flex items-center gap-4">
                                                                        <select value={f.scaleMin||1} onChange={e=>{let nf=[...newEvent.formFields]; nf[idx].scaleMin=parseInt(e.target.value); setNewEvent({...newEvent, formFields: nf})}} className="p-2 border rounded-lg bg-white"><option value="0">0</option><option value="1">1</option></select>
                                                                        <span>ถึง</span>
                                                                        <select value={f.scaleMax||5} onChange={e=>{let nf=[...newEvent.formFields]; nf[idx].scaleMax=parseInt(e.target.value); setNewEvent({...newEvent, formFields: nf})}} className="p-2 border rounded-lg bg-white">{[2,3,4,5,6,7,8,9,10].map(n=><option key={n} value={n}>{n}</option>)}</select>
                                                                    </div>
                                                                    <div className="flex flex-col gap-2">
                                                                        <div className="flex items-center gap-3"><span className="text-sm w-8">{f.scaleMin||1}</span><input type="text" placeholder="ป้ายกำกับ (ไม่บังคับ)" value={f.scaleMinLabel||''} onChange={e=>{let nf=[...newEvent.formFields]; nf[idx].scaleMinLabel=e.target.value; setNewEvent({...newEvent, formFields: nf})}} className="p-2 border rounded-lg text-sm flex-1" /></div>
                                                                        <div className="flex items-center gap-3"><span className="text-sm w-8">{f.scaleMax||5}</span><input type="text" placeholder="ป้ายกำกับ (ไม่บังคับ)" value={f.scaleMaxLabel||''} onChange={e=>{let nf=[...newEvent.formFields]; nf[idx].scaleMaxLabel=e.target.value; setNewEvent({...newEvent, formFields: nf})}} className="p-2 border rounded-lg text-sm flex-1" /></div>
                                                                    </div>
                                                                </div>
                                                            )}

                                                            <div className="flex justify-end pt-4 mt-4 border-t">
                                                                <label className="flex items-center gap-2 text-sm font-bold bg-gray-100 px-4 py-2 rounded-lg cursor-pointer hover:bg-gray-200 transition-colors">
                                                                    <input type="checkbox" checked={f.required} onChange={e=>{let nf=[...newEvent.formFields]; nf[idx].required=e.target.checked; setNewEvent({...newEvent, formFields: nf})}} className="accent-[#C8102E] w-5 h-5 cursor-pointer" /> จำเป็นต้องตอบ
                                                                </label>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>

                                                <button onClick={()=>setNewEvent({...newEvent, formFields: [...(newEvent.formFields||[]), {id: Date.now(), label:'', type:'text', required:false, description:''}]})} className="mt-4 px-4 py-4 border-2 border-dashed border-gray-300 rounded-2xl text-sm font-bold text-gray-500 hover:bg-white hover:border-[#C8102E] hover:text-[#C8102E] transition-all w-full flex justify-center items-center gap-2">
                                                    <i className="ph ph-plus-circle text-xl"></i> เพิ่มคำถาม
                                                </button>
                                            </div>

                                            <div className="flex gap-3 pt-6 border-t mt-6">
                                                <button onClick={()=>{setIsCreating(false); setIsEditing(false);}} className="w-1/3 py-4 bg-gray-100 rounded-xl font-bold text-gray-700 hover:bg-gray-200 transition-colors">ยกเลิก</button>
                                                <button onClick={handleSaveEvent} className="w-2/3 py-4 bg-[#C8102E] text-white rounded-xl font-bold shadow-md hover:bg-[#a10d25] flex justify-center items-center gap-2 transition-colors">
                                                    <i className="ph ph-floppy-disk text-lg"></i> บันทึกกิจกรรม
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* APPLICANTS TAB */}
                            {activeTab === 'applicants' && (
                                <div className="max-w-5xl mx-auto space-y-4 flex flex-col h-full animate-in fade-in">
                                    <div className="flex flex-col md:flex-row gap-3">
                                        <select value={selectedEventId} onChange={e=>setSelectedEventId(e.target.value)} className="p-3.5 border rounded-xl text-sm bg-white flex-1 outline-none focus:border-[#C8102E] shadow-sm font-bold appearance-none cursor-pointer">
                                            <option value="all">ดูรายชื่อผู้สมัครทุกกิจกรรม</option>
                                            {events?.map(e => <option key={e.id} value={e.id}>{e.title}</option>)}
                                        </select>
                                        <button onClick={exportCSV} className="bg-gray-800 text-white px-6 py-3.5 rounded-xl text-sm font-bold shadow-sm hover:bg-black transition-colors flex items-center justify-center gap-2">
                                            <i className="ph ph-download-simple text-lg"></i> Export CSV
                                        </button>
                                    </div>
                                    
                                    <div className="bg-white border rounded-2xl shadow-sm flex-1 overflow-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-gray-50 border-b sticky top-0 shadow-sm"><tr className="text-gray-500"><th className="p-4 font-bold">ข้อมูลผู้สมัคร</th><th className="p-4 font-bold hidden md:table-cell">คำตอบอื่นๆ</th><th className="p-4 font-bold text-right">วันเวลาที่สมัคร</th></tr></thead>
                                            <tbody className="divide-y">
                                                {applicants?.filter(a => selectedEventId==='all' || a.eventId===selectedEventId).map(app => {
                                                    const answersArr = Object.entries(app.answers || {});
                                                    return (
                                                    <tr key={app.id} className="hover:bg-gray-50">
                                                        <td className="p-4">
                                                            <span className="font-bold text-gray-800 block text-base">{answersArr[0]?.[1] || 'ไม่ระบุชื่อ'}</span>
                                                            {selectedEventId === 'all' && <span className="text-[10px] bg-red-50 text-[#C8102E] px-2 py-0.5 rounded border border-red-100 mt-1 inline-block">{events?.find(e=>e.id===app.eventId)?.title}</span>}
                                                        </td>
                                                        <td className="p-4 hidden md:table-cell text-gray-600 text-xs space-y-1">
                                                            {answersArr.slice(1).map(([k,v], idx) => {
                                                                const isFile = typeof v === 'string' && v.startsWith('http');
                                                                return <div key={idx}><span className="font-bold text-gray-500">{k}:</span> {isFile ? <a href={v} target="_blank" className="text-blue-500 hover:underline"><i className="ph ph-link"></i> ดูไฟล์แนบ</a> : Array.isArray(v) ? v.join(', ') : v}</div>
                                                            })}
                                                        </td>
                                                        <td className="p-4 text-right"><span className="text-xs text-gray-500 font-medium block">{app.timestamp}</span></td>
                                                    </tr>
                                                )})}
                                                {(!applicants || applicants.length === 0) && <tr><td colSpan="3" className="p-10 text-center text-gray-500">ไม่มีข้อมูลผู้สมัคร</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* SETTINGS TAB */}
                            {activeTab === 'settings' && (
                                <div className="max-w-2xl mx-auto animate-in fade-in space-y-6">
                                    <div className="bg-white border rounded-3xl p-6 md:p-8 shadow-sm">
                                        <h3 className="font-bold text-xl mb-6 text-gray-800 flex items-center gap-2"><i className="ph ph-lock-key text-[#C8102E]"></i> เปลี่ยนรหัสผ่านแอดมิน</h3>
                                        <form onSubmit={handleChangePassword} className="space-y-4">
                                            <div><label className="block text-sm font-bold text-gray-700 mb-1">รหัสผ่านเดิม</label><input type="password" value={passwords.oldPass} onChange={e=>setPasswords({...passwords, oldPass:e.target.value})} className="w-full border p-3 rounded-xl focus:border-[#C8102E] outline-none" required /></div>
                                            <div><label className="block text-sm font-bold text-gray-700 mb-1">รหัสผ่านใหม่ (8 หลัก)</label><input type="password" value={passwords.newPass} onChange={e=>setPasswords({...passwords, newPass:e.target.value})} className="w-full border p-3 rounded-xl focus:border-[#C8102E] outline-none" maxLength="8" required /></div>
                                            <button type="submit" className="w-full py-3.5 bg-gray-900 text-white rounded-xl font-bold shadow-md hover:bg-black mt-4 transition-colors">อัปเดตรหัสผ่าน</button>
                                        </form>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [selectedEventSlug, setSelectedEventSlug] = useState(null);
            const [alertConfig, setAlertConfig] = useState({ isOpen: false, type: 'info', message: '' });
            
            const [isLoading, setIsLoading] = useState(true);
            const [isGlobalLoading, setGlobalLoading] = useState(false); // ควบคุมแถบโหลดด้านบน
            
            const [events, setEvents] = useState([]);
            const [applicants, setApplicants] = useState([]);

            const showAlert = (message, type = 'info') => setAlertConfig({ isOpen: true, type, message });

            const fetchApi = async (payload = null) => {
                if (!GOOGLE_SCRIPT_URL.startsWith('http')) { showAlert('กรุณาใส่ GOOGLE_SCRIPT_URL ก่อนใช้งาน', 'error'); return {status:'error'}; }
                try {
                    const options = payload ? { method: 'POST', body: JSON.stringify(payload) } : { method: 'GET' };
                    const response = await fetch(payload ? GOOGLE_SCRIPT_URL : `${GOOGLE_SCRIPT_URL}?action=getData`, options);
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        if (!payload) { setEvents(data.events || []); setApplicants(data.applicants || []); } 
                        else { await fetchApi(); }
                    } 
                    return data;
                } catch (err) { console.error(err); showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล', 'error'); return { status: 'error' }; }
            };

            useEffect(() => {
                const init = async () => {
                    await fetchApi();
                    setIsLoading(false);
                    const slug = new URLSearchParams(window.location.search).get('event');
                    if (slug) { setSelectedEventSlug(slug); setCurrentView('event-detail'); }
                };
                init();
            }, []);

            const navigateTo = (view, slug = null) => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
                setCurrentView(view);
                if (slug) { setSelectedEventSlug(slug); window.history.pushState({}, '', `?event=${slug}`); } 
                else { setSelectedEventSlug(null); window.history.pushState({}, '', window.location.pathname); }
            };

            const handleLogout = () => {
                setGlobalLoading(true);
                setTimeout(() => {
                    setIsAdminAuth(false);
                    setCurrentView('home');
                    setGlobalLoading(false);
                }, 500);
            };

            const handleAdminLogin = async (e, pwd) => {
                e.preventDefault();
                setGlobalLoading(true);
                const res = await fetchApi({ action: 'login', password: pwd });
                setGlobalLoading(false);
                if (res.status === 'success') { setAlertConfig({isOpen:false}); setIsAdminAuth(true); setCurrentView('admin-dashboard'); } 
                else showAlert(res.message || 'รหัสผ่านไม่ถูกต้อง', 'error');
            };

            return (
                <div className="min-h-screen flex justify-center bg-gray-200 relative">
                    <div className={`bg-[#F3F4F6] min-h-screen flex flex-col shadow-2xl relative overflow-hidden transition-all duration-300 w-full`}>
                        {/* แถบโหลดสีแดงด้านบน ทำงานทั้งตอนโหลดแอปครั้งแรก และตอนกำลังเซฟข้อมูล */}
                        {(isLoading || isGlobalLoading) && <div className="absolute top-0 left-0 w-full h-1.5 bg-gray-200 z-[300] overflow-hidden"><div className="w-1/2 h-full bg-[#C8102E] animate-[slide_1.5s_ease-in-out_infinite] rounded-full"></div></div>}
                        
                        <CustomAlert config={alertConfig} onClose={() => setAlertConfig({ ...alertConfig, isOpen: false })} />

                        {currentView === 'admin-login' ? (
                            <div className="absolute inset-0 bg-[#F3F4F6] flex items-center justify-center p-4 z-[100]">
                                <div className="w-full max-w-sm bg-white p-8 rounded-3xl shadow-xl border text-center animate-in zoom-in-95">
                                    <img src={HARDCODED_LOGO} className="w-20 h-20 rounded-full mx-auto mb-6 border shadow-sm object-cover" />
                                    <h2 className="font-bold text-xl mb-2 text-gray-800">เข้าสู่ระบบผู้ดูแล</h2>
                                    <p className="text-sm text-gray-500 mb-8">กรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
                                    
                                    <form onSubmit={(e) => handleAdminLogin(e, document.getElementById('pwdInput').value)}>
                                        <div className="relative h-14 flex items-center justify-center bg-gray-50 rounded-2xl border px-2 mb-6" onClick={() => document.getElementById('pwdInput')?.focus()}>
                                            <input id="pwdInput" name="pwd" type="password" maxLength={8} disabled={isGlobalLoading} className="absolute inset-0 w-full h-full opacity-0 z-10 cursor-pointer disabled:cursor-not-allowed" onChange={(e)=>{
                                                const dots = document.querySelectorAll('.pwd-dot');
                                                dots.forEach((dot, i) => {
                                                    if(i < e.target.value.length) dot.classList.replace('bg-gray-300', 'bg-[#C8102E]');
                                                    else dot.classList.replace('bg-[#C8102E]', 'bg-gray-300');
                                                });
                                            }} />
                                            <div className="flex gap-3 pointer-events-none">
                                                {[...Array(8)].map((_, i) => <div key={i} className="pwd-dot w-3.5 h-3.5 rounded-full bg-gray-300 transition-colors duration-200"></div>)}
                                            </div>
                                        </div>
                                        <button type="submit" disabled={isGlobalLoading} className="w-full bg-[#C8102E] text-white p-3.5 rounded-xl font-bold shadow-md hover:bg-[#a10d25] transition-colors disabled:bg-gray-400">
                                            {isGlobalLoading ? 'กำลังตรวจสอบ...' : 'เข้าสู่ระบบ'}
                                        </button>
                                        <button type="button" onClick={()=>setCurrentView('home')} className="mt-4 text-sm font-medium text-gray-500 hover:text-gray-700">กลับหน้าหลัก</button>
                                    </form>
                                </div>
                            </div>
                        ) : isAdminAuth ? (
                            <AdminDashboard onLogout={handleLogout} events={events} applicants={applicants} showAlert={showAlert} fetchApi={fetchApi} setGlobalLoading={setGlobalLoading} />
                        ) : (
                            <>
                                <Header onAdminTrigger={() => setCurrentView('admin-login')} showBack={currentView === 'event-detail' || currentView === 'register'} onBack={() => currentView === 'register' ? navigateTo('event-detail', selectedEventSlug) : navigateTo('home')} />
                                <main className="flex-1 relative pb-safe">
                                    {currentView === 'home' && <HomeView navigateTo={navigateTo} events={events} isLoading={isLoading} />}
                                    {currentView === 'event-detail' && <EventDetailView event={events?.find(e=>e.slug===selectedEventSlug)} navigateTo={navigateTo} getApplicantCount={(id)=>applicants?.filter(a=>a.eventId===id).length||0} />}
                                    {currentView === 'register' && <RegisterView event={events?.find(e=>e.slug===selectedEventSlug)} navigateTo={navigateTo} onSubmit={handleRegisterSubmit} setGlobalLoading={setGlobalLoading} />}
                                    {currentView === 'success' && <SuccessRegistrationView navigateTo={navigateTo} />}
                                </main>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
