<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบกิจกรรมและการรับสมัคร - สภานักเรียนโรงเรียนคำม่วง</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
        body { font-family: 'Noto Sans Thai', sans-serif; background-color: #F3F4F6; color: #1F2937; -webkit-font-smoothing: antialiased; margin: 0; padding: 0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-overlay { background-color: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
        .image-choice-card { transition: all 0.2s ease-in-out; }
        .image-choice-card:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, error: null }; }
            static getDerivedStateFromError(error) { return { hasError: true, error }; }
            componentDidCatch(error, errorInfo) { console.error("App Crashed:", error, errorInfo); }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="p-8 text-center bg-red-50 min-h-screen text-gray-800 flex flex-col items-center justify-center">
                            <i className="ph ph-warning-octagon text-6xl text-red-500 mb-4"></i>
                            <h2 className="text-2xl font-bold mb-2 text-red-600">ระบบขัดข้องชั่วคราว</h2>
                            <p className="mb-6 text-gray-600">กรุณาแคปหน้าจอนี้ส่งให้โปรแกรมเมอร์ดูครับ</p>
                            <button onClick={() => window.location.reload()} className="px-6 py-3 bg-[#C8102E] text-white font-bold rounded-xl shadow-md">โหลดหน้าเว็บใหม่</button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfq999r-lWQcNZmYZWeUxiWNmNOo5q1MQwU5E7CQruSsBliCPMOueVOoRnw5ElbkFOfQ/exec";
        const GITHUB_PAGES_URL = window.location.origin + window.location.pathname; 
        const HARDCODED_LOGO = "https://i.postimg.cc/wBN5btrp/rong-re-yn-kham-wng.png";
        const HARDCODED_NAME = "STUDENT COUNCIL • KHAMMUANG SCHOOL";

        const FIELD_TYPES = [
            { id: 'text', label: 'คำตอบสั้น', icon: 'ph-text-t' },
            { id: 'longtext', label: 'ย่อหน้า', icon: 'ph-text-align-left' },
            { id: 'radio', label: 'หลายตัวเลือก', icon: 'ph-radio-button' },
            { id: 'checkbox', label: 'ช่องทำเครื่องหมาย', icon: 'ph-check-square-offset' },
            { id: 'dropdown', label: 'เลื่อนลง', icon: 'ph-caret-circle-down' },
            { id: 'date', label: 'วันที่', icon: 'ph-calendar-blank' },
            { id: 'time', label: 'เวลา', icon: 'ph-clock' },
            { id: 'scale', label: 'สเกลเชิงเส้น', icon: 'ph-sliders-horizontal' },
            { id: 'file', label: 'อัปโหลดไฟล์', icon: 'ph-upload-simple' },
            { id: 'image-choice', label: 'ตัวเลือกแบบรูปภาพ', icon: 'ph-images' }
        ];

        const CATEGORY_OPTIONS = ["ทั่วไป/อื่นๆ", "กีฬา", "วิชาการ", "ดนตรี/ศิลปะ", "จิตอาสา", "อบรม/ค่าย", "สภานักเรียน", "ไม่ระบุ (-)"];

        const compressImage = (file, callback) => {
            if(!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const MAX_WIDTH = 800; 
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.7)); 
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };

        const Header = ({ onAdminTrigger, showBack, onBack }) => {
            const [logoClicks, setLogoClicks] = useState(0);
            const clickTimeoutRef = useRef(null);
            const handleLogoClick = () => {
                setLogoClicks(prev => prev + 1);
                if (clickTimeoutRef.current) clearTimeout(clickTimeoutRef.current);
                clickTimeoutRef.current = setTimeout(() => setLogoClicks(0), 3000);
                if (logoClicks + 1 >= 5) { onAdminTrigger(); setLogoClicks(0); clearTimeout(clickTimeoutRef.current); }
            };
            return (
                <header className="glass-panel border-b border-[#E5E7EB] px-4 py-3 flex justify-between items-center shadow-sm z-40 sticky top-0">
                    <div className="flex items-center gap-3">
                        {showBack && (
                            <button onClick={onBack} className="mr-1 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors">
                                <i className="ph ph-caret-left text-lg font-bold"></i>
                            </button>
                        )}
                        <img src={HARDCODED_LOGO} alt="Logo" onClick={handleLogoClick} className="w-10 h-10 rounded-full object-cover border shadow-sm cursor-pointer hover:scale-105 transition-transform shrink-0" /> 
                        <div className="flex flex-col justify-center">
                            <h1 className="font-bold text-[#1F2937] text-[14px] md:text-[15px] leading-tight mb-0.5">ระบบกิจกรรมและการรับสมัคร</h1>
                            <p className="text-[9px] md:text-[10px] text-[#6B7280] font-medium leading-none tracking-wide">{HARDCODED_NAME}</p>
                        </div>
                    </div>
                </header>
            );
        };

        const CustomAlert = ({ config, onClose }) => {
            if (!config?.isOpen) return null;
            const isError = config.type === 'error';
            const isSuccess = config.type === 'success';
            return (
                <div className="fixed inset-0 z-[500] flex items-center justify-center p-4 modal-overlay animate-in fade-in">
                    <div className="bg-white rounded-3xl w-full max-w-sm p-8 shadow-2xl text-center animate-in zoom-in-95 border border-gray-100">
                        <div className={`w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner ${isError ? 'bg-red-50 text-[#C8102E]' : isSuccess ? 'bg-green-50 text-green-600' : 'bg-blue-50 text-blue-600'}`}>
                            <i className={`ph text-5xl ph-fill ${isError ? 'ph-warning-circle' : isSuccess ? 'ph-check-circle' : 'ph-info'}`}></i>
                        </div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">{isError ? 'เกิดข้อผิดพลาด' : isSuccess ? 'สำเร็จเรียบร้อย' : 'แจ้งเตือน'}</h3>
                        <p className="text-sm text-gray-500 mb-8 leading-relaxed">{config.message}</p>
                        <button onClick={onClose} className="w-full py-4 bg-gray-900 hover:bg-black text-white font-bold rounded-2xl transition-colors shadow-md text-sm">ตกลง</button>
                    </div>
                </div>
            );
        };

        const ConfirmDialog = ({ config, onCancel, onConfirm }) => {
            if (!config?.isOpen) return null;
            return (
                <div className="fixed inset-0 z-[500] flex items-center justify-center p-4 modal-overlay animate-in fade-in">
                    <div className="bg-white rounded-3xl w-full max-w-sm p-8 shadow-2xl text-center animate-in zoom-in-95 border border-gray-100">
                        <div className="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-5 bg-orange-50 text-orange-500 shadow-inner">
                            <i className="ph ph-warning text-5xl ph-fill"></i>
                        </div>
                        <h3 className="text-xl font-bold text-gray-800 mb-2">{config.title || 'ยืนยันการทำรายการ'}</h3>
                        <p className="text-sm text-gray-500 mb-8 leading-relaxed">{config.message}</p>
                        <div className="flex gap-3">
                            <button onClick={onCancel} className="flex-1 py-4 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl transition-colors text-sm">ยกเลิก</button>
                            <button onClick={onConfirm} className="flex-1 py-4 bg-[#C8102E] hover:bg-[#a10d25] text-white font-bold rounded-2xl transition-colors shadow-md text-sm">ยืนยัน</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- PUBLIC VIEWS ---
        const HomeView = ({ navigateTo, events, isLoading }) => {
            const [searchQuery, setSearchQuery] = useState('');
            const safeEvents = Array.isArray(events) ? events : [];
            const filteredEvents = safeEvents.filter(event => {
                const titleMatch = (event.title || '').toLowerCase().includes(searchQuery.toLowerCase());
                const typeMatch = (event.type || '').toLowerCase().includes(searchQuery.toLowerCase());
                return titleMatch || typeMatch;
            });

            return (
                <div className="p-4 md:p-6 pb-24 animate-in fade-in duration-300 min-h-screen max-w-2xl mx-auto w-full">
                    <div className="bg-gradient-to-br from-[#C8102E] to-[#881337] rounded-3xl p-6 text-white shadow-[0_8px_30px_rgb(200,16,46,0.3)] mb-8 relative overflow-hidden">
                        <div className="absolute right-0 top-0 text-white/10 rotate-12 transform scale-150 pointer-events-none translate-x-4 -translate-y-4"><i className="ph ph-calendar-star text-[140px]"></i></div>
                        <div className="relative z-10">
                            <span className="inline-block px-3 py-1 bg-white/20 backdrop-blur-sm rounded-full text-xs font-bold mb-3 border border-white/30">STUDENT COUNCIL</span>
                            <h2 className="text-2xl font-bold mb-2">ค้นพบกิจกรรมที่ใช่สำหรับคุณ</h2>
                            <p className="text-[#FFE4E6] text-sm leading-relaxed opacity-95 max-w-[85%]">ติดตามข่าวสาร ลงทะเบียนเข้าร่วมกิจกรรม และเป็นส่วนหนึ่งของการขับเคลื่อนโรงเรียนของเรา</p>
                        </div>
                    </div>

                    <div className="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4">
                        <h3 className="text-lg font-bold text-[#1F2937] flex items-center gap-2 shrink-0">
                            <i className="ph ph-fire text-[#C8102E] text-[20px] ph-fill"></i> กิจกรรมทั้งหมด
                        </h3>
                        <div className="relative w-full sm:w-auto">
                            <i className="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-lg pointer-events-none"></i>
                            <input type="text" placeholder="ค้นหากิจกรรม หรือหมวดหมู่..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} className="w-full sm:w-64 pl-10 pr-4 py-2 bg-white border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-[#C8102E] shadow-sm transition-all" />
                        </div>
                    </div>

                    {isLoading ? (
                        <div className="text-center p-8 text-gray-400 animate-pulse"><i className="ph ph-spinner-gap animate-spin text-4xl mb-2"></i><p>กำลังโหลดข้อมูล...</p></div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pb-8">
                            {filteredEvents.map(event => (
                                <div key={event.id} onClick={() => navigateTo('event-detail', event.slug)} className="bg-white rounded-2xl border border-[#E5E7EB] overflow-hidden shadow-sm hover:shadow-md transition-all cursor-pointer group flex flex-col active:scale-[0.98] h-full">
                                    <div className="h-40 md:h-48 shrink-0 relative overflow-hidden bg-gray-100">
                                        <img src={event.image || 'https://via.placeholder.com/400x300?text=No+Image'} alt={event.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                                        <div className="absolute top-3 left-3">
                                            {event.status === 'open' ? (
                                                <span className="bg-[#16A34A] text-white px-2.5 py-1 rounded-lg text-xs font-bold shadow-sm flex items-center gap-1"><i className="ph ph-check-circle"></i> เปิดรับสมัคร</span>
                                            ) : (
                                                <span className="bg-gray-800 text-white px-2.5 py-1 rounded-lg text-xs font-bold shadow-sm flex items-center gap-1"><i className="ph ph-lock-key"></i> ปิดรับสมัคร</span>
                                            )}
                                        </div>
                                    </div>
                                    <div className="p-4 flex flex-col flex-1">
                                        <div className="flex items-center gap-2 mb-1.5"><span className="text-[10px] font-bold text-[#C8102E] bg-red-50 px-2 py-0.5 rounded border border-red-100">{event.type === 'ไม่ระบุ (-)' ? 'กิจกรรม' : event.type || 'กิจกรรม'}</span></div>
                                        <h4 className="font-bold text-gray-800 text-base line-clamp-2 mb-2 group-hover:text-[#C8102E] transition-colors">{event.title}</h4>
                                        <div className="space-y-1.5 mt-auto">
                                            <p className="text-xs text-gray-500 flex items-center gap-1.5"><i className="ph ph-calendar-blank text-[#C8102E]"></i> {event.date || '-'}</p>
                                            <p className="text-xs text-gray-500 flex items-center gap-1.5"><i className="ph ph-map-pin text-[#C8102E]"></i> <span className="truncate">{event.location || '-'}</span></p>
                                        </div>
                                    </div>
                                </div>
                            ))}
                            {filteredEvents.length === 0 && (
                                <div className="col-span-full text-center p-8 bg-white border border-dashed rounded-2xl text-gray-500">
                                    <i className="ph ph-magnifying-glass text-4xl mb-2 text-gray-300"></i>
                                    <p>{searchQuery ? 'ไม่พบกิจกรรมที่ค้นหา' : 'ยังไม่มีกิจกรรมในขณะนี้'}</p>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const EventDetailView = ({ event, navigateTo, getApplicantCount }) => {
            const [copied, setCopied] = useState(false);
            if (!event) return <div className="p-8 text-center text-gray-500">ไม่พบข้อมูลกิจกรรม</div>;

            const shareUrl = `${GITHUB_PAGES_URL}?event=${event.slug}`;
            const qrCodeUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(shareUrl)}&margin=10`;
            const currentCount = getApplicantCount(event.id);
            const isFull = event.capacity && parseInt(event.capacity) > 0 && currentCount >= parseInt(event.capacity);

            const handleShare = () => {
                if (navigator.share) navigator.share({ title: event.title, text: `เชิญร่วมกิจกรรม: ${event.title}`, url: shareUrl }).catch(()=>{});
                else { navigator.clipboard.writeText(shareUrl); setCopied(true); setTimeout(() => setCopied(false), 2000); }
            };

            const formatDisplayDate = (dStr) => {
                if (!dStr) return '-';
                try {
                    const d = new Date(dStr);
                    if (isNaN(d.getTime())) return dStr;
                    return d.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                } catch(e) { return dStr; }
            }

            return (
                <div className="pb-24 animate-in fade-in bg-white min-h-screen max-w-2xl mx-auto w-full relative">
                    <div className="relative h-64 md:h-80 w-full bg-gray-900 shrink-0">
                        <img src={event.image || 'https://via.placeholder.com/800x400'} alt={event.title} className="w-full h-full object-cover opacity-80" />
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                        <div className="absolute bottom-4 left-4 right-4 text-white">
                            <span className="inline-block px-2.5 py-1 bg-[#C8102E] rounded-md text-[10px] font-bold mb-2">{event.type === 'ไม่ระบุ (-)' ? 'กิจกรรม' : event.type || 'กิจกรรม'}</span>
                            <h2 className="text-2xl font-bold leading-tight">{event.title}</h2>
                        </div>
                    </div>

                    <div className="p-5 md:p-8">
                        <div className="flex gap-2 mb-6 border-b pb-6">
                            <button onClick={handleShare} className="flex-1 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl flex items-center justify-center gap-2 transition-colors">
                                {copied ? <><i className="ph ph-check text-green-600 text-lg"></i> คัดลอกแล้ว</> : <><i className="ph ph-share-network text-lg"></i> แชร์กิจกรรม</>}
                            </button>
                            <a href={qrCodeUrl} download={`QR_${event.slug}.png`} target="_blank" className="w-12 h-12 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl flex items-center justify-center transition-colors"><i className="ph ph-qr-code text-2xl"></i></a>
                        </div>

                        <div className="grid grid-cols-2 gap-3 mb-6">
                            <div className="bg-[#F9FAFB] p-3 rounded-xl border flex gap-3 items-start"><div className="bg-red-50 text-[#C8102E] p-2 rounded-lg mt-0.5 shrink-0"><i className="ph ph-calendar-blank text-xl"></i></div><div><p className="text-[10px] text-gray-500 font-bold">วันที่จัดกิจกรรม</p><p className="text-xs font-bold text-gray-800">{event.date || '-'}</p></div></div>
                            <div className="bg-[#F9FAFB] p-3 rounded-xl border flex gap-3 items-start"><div className="bg-red-50 text-[#C8102E] p-2 rounded-lg mt-0.5 shrink-0"><i className="ph ph-clock text-xl"></i></div><div><p className="text-[10px] text-gray-500 font-bold">เวลา</p><p className="text-xs font-bold text-gray-800">{event.time || '-'}</p></div></div>
                            <div className="bg-[#F9FAFB] p-3 rounded-xl border flex gap-3 items-start col-span-2"><div className="bg-red-50 text-[#C8102E] p-2 rounded-lg mt-0.5 shrink-0"><i className="ph ph-map-pin text-xl"></i></div><div><p className="text-[10px] text-gray-500 font-bold">สถานที่</p><p className="text-xs font-bold text-gray-800">{event.location || '-'}</p></div></div>
                        </div>

                        <div className="mb-8">
                            <h3 className="font-bold text-lg mb-3 flex items-center gap-2"><i className="ph ph-info text-[#C8102E]"></i> รายละเอียดกิจกรรม</h3>
                            <p className="text-sm text-gray-600 leading-relaxed whitespace-pre-line">{event.details || '-'}</p>
                        </div>

                        <div className="bg-gray-50 rounded-2xl p-4 border text-sm text-gray-600 mb-8 space-y-2">
                            <div className="flex justify-between"><span className="font-medium text-gray-500">วันเปิดรับสมัคร:</span> <span className="font-bold text-gray-800">{formatDisplayDate(event.openDate)}</span></div>
                            <div className="flex justify-between"><span className="font-medium text-gray-500">วันปิดรับสมัคร:</span> <span className="font-bold text-gray-800">{formatDisplayDate(event.closeDate)}</span></div>
                            <div className="flex justify-between"><span className="font-medium text-gray-500">รับจำนวนจำกัด:</span> <span className={`font-bold ${isFull ? 'text-red-500' : 'text-green-600'}`}>{currentCount}/{event.capacity || 'ไม่จำกัด'} คน</span></div>
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-4 glass-panel border-t shadow-lg z-50">
                        <div className="max-w-2xl mx-auto w-full">
                            {event.status === 'open' && !isFull ? (
                                <button onClick={() => navigateTo('register', event.slug)} className="w-full bg-[#C8102E] hover:bg-[#a10d25] text-white font-bold py-3.5 md:py-4 rounded-xl shadow-md flex justify-center items-center gap-2 transition-colors">
                                    <i className="ph ph-note-pencil text-xl"></i> ไปที่แบบฟอร์มรับสมัคร
                                </button>
                            ) : (
                                <button disabled className="w-full bg-gray-200 text-gray-500 font-bold py-3.5 md:py-4 rounded-xl flex justify-center items-center gap-2 cursor-not-allowed">
                                    <i className="ph ph-lock-key text-xl"></i> {isFull ? 'กิจกรรมนี้มีผู้สมัครเต็มแล้ว' : 'ปิดรับสมัครแล้ว'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const RegisterView = ({ event, navigateTo, onSubmit, setGlobalLoading }) => {
            const [formData, setFormData] = useState({});
            const [errors, setErrors] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [currentStep, setCurrentStep] = useState(0);

            if (!event) return <div className="p-8 text-center text-gray-500">ไม่พบฟอร์มสำหรับกิจกรรมนี้</div>;

            let parsedFields = [];
            try {
                if (Array.isArray(event.formFields)) parsedFields = event.formFields;
                else if (typeof event.formFields === 'string') {
                    const trimmed = event.formFields.trim();
                    if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
                        parsedFields = JSON.parse(trimmed);
                        if(!Array.isArray(parsedFields)) parsedFields = [parsedFields];
                    }
                }
            } catch(e) { console.error("Parse Error!", e); }

            if (parsedFields.length === 0) parsedFields = [{ id: 1, label: 'ชื่อ-นามสกุล', type: 'text', required: true }];

            const introTitle = event.formIntroTitle || 'ข้อมูลการสมัคร';
            const introDesc = event.formIntroDesc !== undefined ? event.formIntroDesc : 'โปรดกรอกข้อมูลตามความเป็นจริงให้ครบถ้วน';

            let formSteps = [];
            let currentGroup = { title: introTitle, description: introDesc, fields: [] };

            parsedFields.forEach(f => {
                if (f.type === 'section') {
                    if (currentGroup.fields.length > 0 || formSteps.length === 0) {
                        formSteps.push(currentGroup);
                    }
                    currentGroup = { title: f.label || 'ส่วนถัดไป', description: f.description || '', fields: [] };
                } else {
                    currentGroup.fields.push(f);
                }
            });
            if (currentGroup.fields.length > 0) formSteps.push(currentGroup);
            if (formSteps.length === 0) formSteps = [{ title: introTitle, description: introDesc, fields: parsedFields }];

            const handleInputChange = (fieldLabel, value, isCheckbox = false) => {
                if (!fieldLabel) return;
                if (isCheckbox) {
                    const current = formData[fieldLabel] || [];
                    const updated = current.includes(value) ? current.filter(v => v !== value) : [...current, value];
                    setFormData({ ...formData, [fieldLabel]: updated });
                } else {
                    setFormData({ ...formData, [fieldLabel]: value });
                }
                if (errors[fieldLabel]) setErrors({ ...errors, [fieldLabel]: null });
            };

            const handleFileUpload = (fieldLabel, e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 5 * 1024 * 1024) { setErrors({ ...errors, [fieldLabel]: 'ไฟล์ขนาดใหญ่เกิน 5MB' }); e.target.value = null; return; }
                const reader = new FileReader();
                reader.onloadend = () => { setFormData({ ...formData, [fieldLabel]: reader.result }); if (errors[fieldLabel]) setErrors({ ...errors, [fieldLabel]: null }); };
                reader.readAsDataURL(file);
            };

            const validateCurrentStep = () => {
                const newErrors = {};
                formSteps[currentStep].fields.forEach(f => {
                    if (!f || !f.label) return;
                    if (f.required && f.type !== 'image-ref') {
                        const val = formData[f.label];
                        if (val === undefined || val === null || val === '' || (Array.isArray(val) && val.length === 0)) {
                            newErrors[f.label] = 'กรุณากรอกข้อมูลนี้ให้ครบถ้วน';
                        }
                    }
                });
                if (Object.keys(newErrors).length > 0) {
                    setErrors(newErrors);
                    window.scrollTo(0, 0);
                    return false;
                }
                return true;
            };

            const handleNext = () => { if (validateCurrentStep()) { setCurrentStep(prev => prev + 1); window.scrollTo(0, 0); } };
            const handlePrev = () => { setCurrentStep(prev => prev - 1); window.scrollTo(0, 0); };

            const handleSubmit = async () => {
                if (!validateCurrentStep()) return;
                setIsSubmitting(true);
                setGlobalLoading(true); 
                await onSubmit({ eventId: event.id, answers: formData });
                setIsSubmitting(false);
                setGlobalLoading(false);
            };

            const progressPercentage = ((currentStep + 1) / formSteps.length) * 100;

            return (
                <div className="pb-24 animate-in fade-in bg-[#F9FAFB] min-h-screen max-w-2xl mx-auto w-full relative">
                    
                    <div className="relative h-48 sm:h-56 w-full bg-gray-900 shrink-0 shadow-sm rounded-b-3xl overflow-hidden mb-6">
                        {event.image ? (
                            <img src={event.image} alt={event.title} className="w-full h-full object-cover opacity-70" />
                        ) : (
                            <div className="w-full h-full bg-gradient-to-r from-red-800 to-[#C8102E] opacity-90"></div>
                        )}
                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                        <div className="absolute bottom-4 left-4 right-4 text-white">
                            <span className="inline-block px-2 py-0.5 bg-[#C8102E] rounded text-[10px] font-bold mb-1 shadow-sm">{event.type === 'ไม่ระบุ (-)' ? 'กิจกรรม' : event.type || 'กิจกรรม'}</span>
                            <h2 className="text-xl font-bold leading-tight line-clamp-2">{event.title}</h2>
                        </div>
                    </div>

                    <div className="px-4 md:px-8 space-y-6">
                        {formSteps.length > 1 && (
                            <div className="mb-2">
                                <div className="flex justify-between text-[11px] font-bold text-gray-500 mb-2">
                                    <span>ขั้นตอนที่ {currentStep + 1} จาก {formSteps.length}</span>
                                    <span>{Math.round(progressPercentage)}%</span>
                                </div>
                                <div className="w-full h-1.5 bg-gray-200 rounded-full overflow-hidden">
                                    <div className="h-full bg-[#C8102E] transition-all duration-300" style={{ width: `${progressPercentage}%` }}></div>
                                </div>
                            </div>
                        )}

                        <div className="bg-white p-5 md:p-6 rounded-2xl border border-gray-200 shadow-sm">
                            <h2 className="text-xl font-bold text-[#C8102E] leading-tight mb-2">{formSteps[currentStep].title}</h2>
                            {formSteps[currentStep].description && <p className="text-sm text-gray-600">{formSteps[currentStep].description}</p>}
                        </div>

                        <div className="space-y-5 animate-in slide-in-from-right-4 duration-300">
                            {formSteps[currentStep].fields.map((field, idx) => {
                                if (!field || (!field.label && field.type !== 'image-ref')) return null; 
                                const fieldType = field.type || 'text';
                                
                                if (fieldType === 'image-ref') {
                                    return (
                                        <div key={idx} className="bg-gray-900 rounded-2xl overflow-hidden shadow-md relative group">
                                            {field.imageUrl ? <img src={field.imageUrl} className="w-full h-auto" /> : <div className="p-8 text-center text-gray-400 border border-dashed rounded-2xl">ไม่ได้แนบรูปภาพอ้างอิง</div>}
                                            {field.description && <div className="absolute bottom-0 left-0 w-full bg-black/60 backdrop-blur text-white p-3 text-sm font-medium">{field.description}</div>}
                                        </div>
                                    );
                                }

                                return (
                                    <div key={idx} className={`bg-white p-5 md:p-6 rounded-2xl border shadow-sm transition-colors ${errors[field.label] ? 'border-red-400 bg-red-50/20 ring-1 ring-red-100' : 'border-gray-200'}`}>
                                        <div className="mb-4">
                                            <label className="block font-bold text-gray-800 text-sm md:text-base">
                                                {field.label} {field.required && <span className="text-[#C8102E] text-lg leading-none">*</span>}
                                            </label>
                                            {field.description && <p className="text-xs text-gray-500 mt-1 leading-relaxed">{field.description}</p>}
                                        </div>
                                        
                                        {fieldType === 'text' && <input type="text" value={formData[field.label] || ''} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-full p-3.5 rounded-xl border focus:border-[#C8102E] outline-none shadow-sm bg-gray-50 focus:bg-white transition-colors" />}
                                        
                                        {fieldType === 'longtext' && <textarea value={formData[field.label] || ''} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-full p-3.5 rounded-xl border focus:border-[#C8102E] outline-none min-h-[100px] shadow-sm bg-gray-50 focus:bg-white transition-colors"></textarea>}
                                        
                                        {fieldType === 'dropdown' && (
                                            <div className="relative">
                                                <select value={formData[field.label] || ''} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-full p-3.5 rounded-xl border focus:border-[#C8102E] outline-none bg-gray-50 focus:bg-white appearance-none shadow-sm cursor-pointer transition-colors">
                                                    <option value="" disabled>-- เลือกคำตอบ --</option>
                                                    {(field.options||[]).map((opt, i) => <option key={i} value={opt.text || opt}>{opt.text || opt}</option>)}
                                                </select>
                                                <i className="ph ph-caret-down absolute right-4 top-4 text-gray-400 pointer-events-none"></i>
                                            </div>
                                        )}
                                        
                                        {(fieldType === 'radio' || fieldType === 'checkbox') && (
                                            <div className="flex flex-col gap-3">
                                                {(field.options||[]).map((opt, i) => {
                                                    const val = opt.text || opt;
                                                    return (
                                                    <label key={i} className="flex items-start gap-3 cursor-pointer group">
                                                        <div className="mt-0.5 shrink-0">
                                                            <input type={fieldType} name={field.label} value={val} checked={fieldType === 'radio' ? formData[field.label] === val : (formData[field.label] || []).includes(val)} onChange={(e) => handleInputChange(field.label, e.target.value, fieldType === 'checkbox')} className="w-5 h-5 accent-[#C8102E] cursor-pointer" />
                                                        </div>
                                                        <span className="text-sm font-medium text-gray-700 group-hover:text-black">{val}</span>
                                                    </label>
                                                )})}
                                            </div>
                                        )}

                                        {fieldType === 'image-choice' && (
                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                                                {(field.options||[]).map((opt, i) => {
                                                    const isSelected = formData[field.label] === (opt.text || opt);
                                                    return (
                                                    <div key={i} onClick={() => handleInputChange(field.label, opt.text || opt)} className={`image-choice-card border-2 rounded-2xl overflow-hidden cursor-pointer bg-white flex flex-col shadow-sm relative ${isSelected ? 'border-[#C8102E] ring-2 ring-[#C8102E]/20' : 'border-gray-200 hover:border-gray-300'}`}>
                                                        <div className="h-28 bg-gray-100 flex items-center justify-center overflow-hidden">
                                                            {opt.imageUrl ? <img src={opt.imageUrl} className="w-full h-full object-cover" /> : <i className="ph ph-image text-3xl text-gray-300"></i>}
                                                        </div>
                                                        <div className={`p-3 text-center text-sm font-bold flex-1 flex items-center justify-center ${isSelected ? 'bg-red-50 text-[#C8102E]' : 'text-gray-600'}`}>
                                                            {opt.text || opt}
                                                        </div>
                                                        {isSelected && <div className="absolute top-2 right-2 bg-[#C8102E] text-white rounded-full w-6 h-6 flex items-center justify-center shadow-md"><i className="ph ph-check font-bold"></i></div>}
                                                    </div>
                                                )})}
                                            </div>
                                        )}
                                        
                                        {fieldType === 'date' && <input type="date" value={formData[field.label] || ''} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-full p-3.5 rounded-xl border focus:border-[#C8102E] outline-none shadow-sm bg-gray-50 focus:bg-white cursor-pointer max-w-xs transition-colors" />}
                                        {fieldType === 'time' && <input type="time" value={formData[field.label] || ''} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-full p-3.5 rounded-xl border focus:border-[#C8102E] outline-none shadow-sm bg-gray-50 focus:bg-white cursor-pointer max-w-xs transition-colors" />}
                                        
                                        {fieldType === 'scale' && (() => {
                                            const min = parseInt(field.scaleMin) || 1;
                                            const max = parseInt(field.scaleMax) || 5;
                                            const items = [];
                                            for(let n = min; n <= max; n++) items.push(n);
                                            return (
                                                <div className="bg-gray-50 p-4 rounded-xl border shadow-sm overflow-x-auto">
                                                    <div className="flex justify-between text-xs text-gray-500 mb-3 font-bold px-2 min-w-[200px]"><span>{field.scaleMinLabel || 'น้อย'}</span><span>{field.scaleMaxLabel || 'มาก'}</span></div>
                                                    <div className="flex justify-between items-center px-2 min-w-[200px]">
                                                        {items.map(num => (
                                                            <label key={num} className="flex flex-col items-center gap-2 cursor-pointer">
                                                                <input type="radio" name={field.label} value={num} checked={String(formData[field.label]) === String(num)} onChange={(e) => handleInputChange(field.label, e.target.value)} className="w-5 h-5 accent-[#C8102E] cursor-pointer" />
                                                                <span className="text-sm font-bold text-gray-600">{num}</span>
                                                            </label>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                        
                                        {fieldType === 'file' && (
                                            <div>
                                                <label className="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                                                    <div className="flex flex-col items-center justify-center pt-5 pb-6 text-gray-500"><i className="ph ph-upload-simple text-3xl mb-2 text-[#C8102E]"></i><p className="text-sm font-bold">คลิกเพื่ออัปโหลดไฟล์</p><p className="text-xs mt-1">(สูงสุด 5MB)</p></div>
                                                    <input type="file" className="hidden" accept="image/*,.pdf" onChange={(e) => handleFileUpload(field.label, e)} />
                                                </label>
                                                {formData[field.label] && (
                                                    <div className="mt-3 flex items-center justify-between p-3 bg-green-50 border border-green-200 rounded-lg"><span className="text-xs font-bold text-green-700 flex items-center gap-2 truncate"><i className="ph ph-check-circle text-lg shrink-0"></i> แนบไฟล์เรียบร้อย</span><button onClick={()=>handleInputChange(field.label, null)} className="text-xs text-red-500 hover:underline shrink-0 ml-2">ลบไฟล์</button></div>
                                                )}
                                            </div>
                                        )}
                                        {errors[field.label] && <p className="text-red-500 text-sm mt-3 font-bold flex items-center gap-1.5"><i className="ph ph-warning-circle text-lg"></i> {errors[field.label]}</p>}
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-4 glass-panel border-t z-50 flex gap-3">
                        <div className="max-w-2xl mx-auto w-full flex gap-3">
                            {currentStep > 0 ? (
                                <button onClick={handlePrev} className="w-1/3 bg-white text-gray-700 border font-bold py-3.5 md:py-4 rounded-xl hover:bg-gray-50 transition-colors">ย้อนกลับ</button>
                            ) : (
                                <button onClick={() => navigateTo('event-detail', event.slug)} className="w-1/3 bg-white text-gray-700 border font-bold py-3.5 md:py-4 rounded-xl hover:bg-gray-50 transition-colors">ยกเลิก</button>
                            )}
                            
                            {currentStep < formSteps.length - 1 ? (
                                <button onClick={handleNext} className="w-2/3 bg-gray-900 text-white font-bold py-3.5 md:py-4 rounded-xl shadow-md hover:bg-black transition-colors">ถัดไป <i className="ph ph-arrow-right"></i></button>
                            ) : (
                                <button onClick={handleSubmit} disabled={isSubmitting} className="w-2/3 bg-[#C8102E] hover:bg-[#a10d25] text-white font-bold py-3.5 md:py-4 rounded-xl shadow-md disabled:bg-gray-400 flex items-center justify-center gap-2 transition-colors">
                                    {isSubmitting ? <><i className="ph ph-spinner-gap animate-spin text-xl"></i> กำลังส่ง...</> : 'ยืนยันการสมัคร'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const SuccessRegistrationView = ({ navigateTo }) => (
            <div className="flex flex-col items-center justify-center min-h-screen px-6 text-center animate-in zoom-in-95 max-w-lg mx-auto w-full pb-20">
                <div className="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center text-green-600 mx-auto mb-6 shadow-inner"><i className="ph ph-check-circle text-[60px] ph-fill"></i></div>
                <h2 className="text-3xl font-bold mb-3 text-gray-800">ส่งข้อมูลสำเร็จ!</h2>
                <p className="text-gray-500 mb-10 text-sm leading-relaxed">ระบบได้รับข้อมูลการสมัครของคุณเรียบร้อยแล้ว<br/>ขอบคุณที่ให้ความสนใจเข้าร่วมกิจกรรมของเรา</p>
                <button onClick={() => navigateTo('home')} className="w-full bg-gray-900 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-black transition-colors flex items-center justify-center gap-2">
                    <i className="ph ph-house text-xl"></i> กลับสู่หน้ากิจกรรมทั้งหมด
                </button>
            </div>
        );

        // --- ADMIN VIEWS ---
        const AdminDashboard = ({ onLogout, events, applicants, showAlert, fetchApi, setGlobalLoading }) => {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedEventId, setSelectedEventId] = useState('all');
            const [isCreating, setIsCreating] = useState(false);
            const [isEditing, setIsEditing] = useState(false);
            const [passwords, setPasswords] = useState({ oldPass: '', newPass: '' });
            
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [confirmDialog, setConfirmDialog] = useState({ isOpen: false, title: '', message: '', onConfirm: null });
            
            // ⚠️ ปรับปรุง defaultEvent ให้ครอบคลุมฟิลด์ทั้งหมด
            const defaultEvent = { 
                id: '', slug: '', title:'', type:'ทั่วไป/อื่นๆ', details:'', date:'', time:'', location:'', image:'', capacity:'', openDate:'', closeDate:'', 
                formIntroTitle: 'ข้อมูลการสมัคร', formIntroDesc: 'โปรดกรอกข้อมูลตามความเป็นจริงให้ครบถ้วน',
                formFields: [{id: 1, label: 'ชื่อ-นามสกุล', description: '', type: 'text', required: true}] 
            };
            const [newEvent, setNewEvent] = useState(defaultEvent);

            const updateFieldType = (idx, type) => {
                let nf = [...(newEvent.formFields || [])];
                nf[idx].type = type;
                if (type === 'section') { nf[idx].label = 'ส่วนใหม่'; nf[idx].description = ''; }
                else if (type === 'image-ref') { nf[idx].imageUrl = ''; nf[idx].description = ''; nf[idx].label = 'รูปภาพอ้างอิง'; }
                else if (['dropdown', 'radio', 'checkbox'].includes(type) && (!nf[idx].options || typeof nf[idx].options[0] !== 'object')) { 
                    nf[idx].options = [{ text: 'ตัวเลือก 1', imageUrl: '' }]; 
                }
                else if (type === 'image-choice' && (!nf[idx].options || typeof nf[idx].options[0] !== 'object')) {
                    nf[idx].options = [{ text: 'ตัวเลือก A', imageUrl: '' }, { text: 'ตัวเลือก B', imageUrl: '' }];
                }
                else if (type === 'scale') { nf[idx].scaleMin = 1; nf[idx].scaleMax = 5; nf[idx].scaleMinLabel = 'น้อย'; nf[idx].scaleMaxLabel = 'มาก'; }
                setNewEvent({...newEvent, formFields: nf});
            }

            const addOptionToField = (fieldIdx) => { 
                let nf = [...newEvent.formFields]; 
                const optCount = nf[fieldIdx].options.length + 1;
                nf[fieldIdx].options.push({ text: `ตัวเลือก ${optCount}`, imageUrl: '' }); 
                setNewEvent({...newEvent, formFields: nf}); 
            }
            const updateOptionText = (fieldIdx, optIdx, val, key = 'text') => { 
                let nf = [...newEvent.formFields]; 
                if(typeof nf[fieldIdx].options[optIdx] !== 'object') nf[fieldIdx].options[optIdx] = { text: nf[fieldIdx].options[optIdx], imageUrl: '' };
                nf[fieldIdx].options[optIdx][key] = val; 
                setNewEvent({...newEvent, formFields: nf}); 
            }
            const handleOptionImageUpload = (fieldIdx, optIdx, e) => {
                const file = e.target.files[0];
                if(!file) return;
                compressImage(file, (base64) => { updateOptionText(fieldIdx, optIdx, base64, 'imageUrl'); });
            };

            const removeOption = (fieldIdx, optIdx) => { let nf = [...newEvent.formFields]; nf[fieldIdx].options.splice(optIdx, 1); setNewEvent({...newEvent, formFields: nf}); }
            const removeField = (fieldIdx) => { let nf = [...newEvent.formFields]; nf.splice(fieldIdx, 1); setNewEvent({...newEvent, formFields: nf}); }

            const addSection = () => {
                let nf = [...newEvent.formFields];
                nf.push({ id: Date.now(), type: 'section', label: 'ส่วนใหม่', description: '' });
                setNewEvent({...newEvent, formFields: nf});
            };

            const addImageRef = () => {
                let nf = [...newEvent.formFields];
                nf.push({ id: Date.now(), type: 'image-ref', label: 'รูปภาพอ้างอิง', description: '', imageUrl: '' });
                setNewEvent({...newEvent, formFields: nf});
            };

            // ⚠️ ฟังก์ชันบันทึกที่อัปเดตใหม่
            const handleSaveEvent = async () => {
                if(!newEvent.title || !newEvent.date) return showAlert('กรุณากรอกชื่อกิจกรรมและวันที่ให้ครบถ้วน', 'error');
                
                setGlobalLoading(true);
                let payload;
                if (isEditing) {
                    // ถ้ากำลังแก้ไข ให้ส่งข้อมูลทั้งหมดไปทับของเดิม (รวมถึง ID และ Slug เดิม)
                    payload = { action: 'updateEvent', event: newEvent };
                } else {
                    // ถ้าสร้างใหม่ สร้าง ID และ Slug ใหม่
                    const eventId = `EVT-${Math.floor(Math.random() * 10000)}`;
                    const slug = Math.random().toString(36).substring(2, 8); // ลิงก์สั้น 6 หลัก
                    payload = { action: 'createEvent', event: { ...newEvent, id: eventId, slug: slug, status: 'open' } };
                }
                
                const res = await fetchApi(payload);
                setGlobalLoading(false);
                if (res.status === 'success') { 
                    showAlert('บันทึกสำเร็จ!', 'success'); 
                    setIsCreating(false); 
                    setIsEditing(false); 
                    setNewEvent(defaultEvent); 
                }
            };

            // ⚠️ ฟังก์ชันเปิดโหมดแก้ไขที่สมบูรณ์ขึ้น
            const openEditMode = (event) => {
                let parsedFields = [];
                try {
                    if (Array.isArray(event.formFields)) parsedFields = event.formFields;
                    else if (typeof event.formFields === 'string') {
                        const trimmed = event.formFields.trim();
                        if (trimmed.startsWith('[') || trimmed.startsWith('{')) {
                            const p = JSON.parse(trimmed);
                            parsedFields = Array.isArray(p) ? p : [p];
                        }
                    }
                } catch(e) { parsedFields = []; }
                
                parsedFields = parsedFields.map(f => {
                    if(['dropdown', 'radio', 'checkbox', 'image-choice'].includes(f.type) && f.options) {
                        f.options = f.options.map(opt => typeof opt === 'string' ? {text: opt, imageUrl: ''} : opt);
                    }
                    return f;
                });

                // ดึงข้อมูลทั้งหมดของกิจกรรมนั้นมาใส่ใน newEvent state รวมถึง id, slug
                setNewEvent({
                    ...event, 
                    formFields: Array.isArray(parsedFields) && parsedFields.length > 0 ? parsedFields : defaultEvent.formFields,
                    formIntroTitle: event.formIntroTitle || 'ข้อมูลการสมัคร',
                    formIntroDesc: event.formIntroDesc !== undefined ? event.formIntroDesc : 'โปรดกรอกข้อมูลตามความเป็นจริงให้ครบถ้วน'
                });
                setIsEditing(true);
                setIsCreating(true);
            };

            const toggleStatus = async (eventId, currentStatus) => {
                const newStatus = currentStatus === 'open' ? 'closed' : 'open';
                setGlobalLoading(true);
                await fetchApi({ action: 'toggleEventStatus', eventId, status: newStatus });
                setGlobalLoading(false);
            };
            
            const handleDeleteEvent = (eventId) => {
                setConfirmDialog({
                    isOpen: true,
                    title: 'ยืนยันการลบกิจกรรม',
                    message: 'คุณแน่ใจหรือไม่ที่จะลบกิจกรรมนี้? ข้อมูลทั้งหมดของผู้สมัครจะถูกลบและไม่สามารถกู้คืนได้',
                    onConfirm: async () => {
                        setConfirmDialog({ isOpen: false });
                        setGlobalLoading(true);
                        const res = await fetchApi({ action: 'deleteEvent', eventId });
                        setGlobalLoading(false);
                        if(res.status === 'success') showAlert('ลบกิจกรรมเรียบร้อยแล้ว', 'success');
                    }
                });
            };

            const handleDeleteApplicant = (appId) => {
                setConfirmDialog({
                    isOpen: true,

                        setConfirmDialog({ isOpen: false });
                        setGlobalLoading(true);

                e.preventDefault();
                if(passwords.newPass.length < 8) return showAlert('รหัสผ่านใหม่ต้องมีอย่างน้อย 8 ตัว', 'error');
                setGlobalLoading(true);
                const res = await fetchApi({ action: 'changePassword', oldPassword: passwords.oldPass, newPassword: passwords.newPass });
                setGlobalLoading(false);
                if(res.status === 'success') { showAlert('เปลี่ยนรหัสผ่านสำเร็จ', 'success'); setPasswords({oldPass:'', newPass:''}); }

            };

            const exportCSV = () => {
                const safeApplicants = Array.isArray(applicants) ? applicants : [];
                const filtered = safeApplicants.filter(a => selectedEventId === 'all' || a.eventId === selectedEventId);
                if (filtered.length === 0) return showAlert('ไม่มีข้อมูลให้ Export', 'error');
                
                let headers = new Set(["Timestamp", "EventTitle"]);
                filtered.forEach(a => Object.keys(a.answers || {}).forEach(k => headers.add(k)));
                headers = Array.from(headers);

                let csvContent = "\uFEFF" + headers.map(h => `"${h}"`).join(",") + "\n"; 
                filtered.forEach(a => {
                    const evtTitle = events?.find(e=>e.id === a.eventId)?.title || '';
                    let row = [`"${a.timestamp}"`, `"${evtTitle}"`];
                    headers.slice(2).forEach(h => {
                        let val = (a.answers && a.answers[h]) ? a.answers[h] : "";

                        row.push(`"${String(val).replace(/"/g, '""')}"`);
                    });
                    csvContent += row.join(",") + "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a"); 
                link.setAttribute("href", url); 
                link.setAttribute("download", `Applicants_${selectedEventId}_${Date.now()}.csv`); 
                document.body.appendChild(link); 
                link.click(); 
                document.body.removeChild(link);

            safeEvents.forEach(e => {

                categoryCounts[cat] = (categoryCounts[cat] || 0) + 1;

                                                                    <div className="font-bold text-gray-800 border-b pb-2 border-gray-100 flex items-center gap-2 mb-4"><i className="ph ph-image text-xl text-blue-500"></i> แทรกรูปภาพให้ผู้สมัครดู</div>

                                                                            <div className="relative w-full h-32 bg-gray-100 rounded-xl overflow-hidden border">

                                                                                <button onClick={()=>{let nf=[...newEvent.formFields]; nf[idx].imageUrl=''; setNewEvent({...newEvent, formFields: nf});}} className="absolute top-2 right-2 bg-white rounded-full p-1.5 shadow hover:text-red-500"><i className="ph ph-trash text-lg"></i></button>
                                                                            </div>

                                                                            <label className="flex flex-col items-center justify-center w-full h-24 border-2 border-dashed border-gray-300 rounded-xl cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                                                                                <span className="text-sm font-bold text-gray-500 flex items-center gap-2"><i className="ph ph-upload-simple text-xl"></i> อัปโหลดรูปภาพจากเครื่อง</span>
                                                                                <input type="file" className="hidden" accept="image/*" onChange={(e)=>{
                                                                                    if(e.target.files[0]) compressImage(e.target.files[0], (base64)=>{let nf=[...newEvent.formFields]; nf[idx].imageUrl=base64; setNewEvent({...newEvent, formFields: nf});});
                                                                                }} />
                                                                            </label>
                                                                        )}
                                                                    </div>
                                                                    <input type="text" placeholder="คำอธิบายใต้ภาพ (ไม่บังคับ)" value={f.description||''} onChange={e=>{let nf=[...(newEvent.formFields||[])]; nf[idx].description=e.target.value; setNewEvent({...newEvent, formFields: nf})}} className="w-full p-2 text-xs bg-transparent border-b border-dashed outline-none" />

                                                        return (
                                                            <div key={idx} className="p-5 bg-white border border-gray-200 rounded-2xl shadow-sm relative group hover:border-[#C8102E] transition-colors">

                                                                    <button onClick={()=>removeField(idx)} className="absolute -top-3 -right-3 w-8 h-8 bg-white border text-gray-400 hover:text-red-500 rounded-full flex items-center justify-center shadow-sm z-10 transition-colors"><i className="ph ph-x font-bold"></i></button>
                                                                )}
                                                                <div className="flex flex-col md:flex-row gap-4 items-start md:items-center mb-2">
                                                                    <input type="text" placeholder="คำถาม" value={f.label} onChange={e=>{let nf=[...(newEvent.formFields||[])]; nf[idx].label=e.target.value; setNewEvent({...newEvent, formFields: nf})}} className="flex-1 p-3 bg-gray-50 border-b-2 border-gray-300 focus:border-[#C8102E] focus:bg-white outline-none font-bold text-gray-800 w-full rounded-t-lg transition-colors" />
                                                                    <div className="relative w-full md:w-auto min-w-[200px]">
                                                                        <select value={f.type} onChange={e=>updateFieldType(idx, e.target.value)} className="w-full p-3 border rounded-xl text-sm bg-white outline-none cursor-pointer appearance-none shadow-sm pr-10 font-medium">
                                                                            {FIELD_TYPES.map(type => <option key={type.id} value={type.id}>{type.label}</option>)}

                                                                <input 
                                                                    type="text" 
                                                                    placeholder="คำอธิบายเพิ่มเติม (ไม่บังคับ) เช่น ระบุไซส์เสื้อ, ไม่ต้องใส่คำนำหน้า" 
                                                                    value={f.description || ''} 
                                                                    onChange={e=>{let nf=[...(newEvent.formFields||[])]; nf[idx].description=e.target.value; setNewEvent({...newEvent, formFields: nf})}} 
                                                                    className="w-full p-2 mb-4 text-xs bg-transparent border-b border-dashed border-gray-300 focus:border-[#C8102E] outline-none text-gray-500 transition-colors"

                                                                    <div className="pl-2 space-y-3 mt-4">
                                                                        {(f.options||[]).map((opt, optIdx) => (
                                                                            <div key={optIdx} className="flex gap-3 items-center">
                                                                                <i className={`text-gray-400 text-lg ${f.type==='radio'?'ph-circle':f.type==='checkbox'?'ph-square':'ph-list'}`}></i>
                                                                                <input type="text" value={opt.text || opt} onChange={e=>updateOptionText(idx, optIdx, e.target.value, 'text')} className="flex-1 border-b p-2 text-sm outline-none focus:border-[#C8102E]" placeholder={`ตัวเลือกที่ ${optIdx+1}`} />
                                                                                {(f.options||[]).length > 1 && <button onClick={()=>removeOption(idx, optIdx)} className="text-gray-400 hover:text-red-500"><i className="ph ph-x"></i></button>}
                                                                            </div>

                                                                                    {opt.imageUrl ? (
                                                                                        <>
                                                                                            <img src={opt.imageUrl} className="w-full h-full object-cover" />
                                                                                            <button onClick={()=>updateOptionText(idx, optIdx, '', 'imageUrl')} className="absolute inset-0 bg-black/50 text-white flex items-center justify-center opacity-0 group-hover/img:opacity-100 transition-opacity"><i className="ph ph-trash"></i></button>

                                                                                    <input type="text" value={opt.text || ''} onChange={e=>updateOptionText(idx, optIdx, e.target.value, 'text')} className="w-full border-b p-2 text-sm outline-none focus:border-[#C8102E]" placeholder={`ชื่อตัวเลือก (เช่น ลาย A)`} />

                                                                        <button onClick={()=>addOptionToField(idx)} className="text-sm font-bold text-[#C8102E] hover:underline mt-2 flex items-center gap-1"><i className="ph ph-plus"></i> เพิ่มตัวเลือกรูปภาพ</button>
                                                                    </div>

                                                                {f.type === 'scale' && (
                                                                    <div className="flex flex-col gap-4 mt-4 bg-gray-50 p-4 rounded-xl border">
                                                                        <div className="flex items-center gap-4">
                                                                            <select value={f.scaleMin||1} onChange={e=>{let nf=[...newEvent.formFields]; nf[idx].scaleMin=parseInt(e.target.value); setNewEvent({...newEvent, formFields: nf})}} className="p-2 border rounded-lg bg-white"><option value="0">0</option><option value="1">1</option></select>
                                                                            <span>ถึง</span>
                                                                            <select value={f.scaleMax||5} onChange={e=>{let nf=[...newEvent.formFields]; nf[idx].scaleMax=parseInt(e.target.value); setNewEvent({...newEvent, formFields: nf})}} className="p-2 border rounded-lg bg-white">{[2,3,4,5,6,7,8,9,10].map(n=><option key={n} value={n}>{n}</option>)}</select>
                                                                        </div>
                                                                        <div className="flex flex-col gap-2">
                                                                            <div className="flex items-center gap-3"><span className="text-sm w-8">{f.scaleMin||1}</span><input type="text" placeholder="ป้ายกำกับ (ไม่บังคับ)" value={f.scaleMinLabel||''} onChange={e=>{let nf=[...newEvent.formFields]; nf[idx].scaleMinLabel=e.target.value; setNewEvent({...newEvent, formFields: nf})}} className="p-2 border rounded-lg text-sm flex-1" /></div>
                                                                            <div className="flex items-center gap-3"><span className="text-sm w-8">{f.scaleMax||5}</span><input type="text" placeholder="ป้ายกำกับ (ไม่บังคับ)" value={f.scaleMaxLabel||''} onChange={e=>{let nf=[...newEvent.formFields]; nf[idx].scaleMaxLabel=e.target.value; setNewEvent({...newEvent, formFields: nf})}} className="p-2 border rounded-lg text-sm flex-1" /></div>
                                                                        </div>
                                                                    </div>
                                                                )}

                                                                <div className="flex justify-end pt-4 mt-4 border-t">

                                                                        <input type="checkbox" checked={f.required} onChange={e=>{let nf=[...newEvent.formFields]; nf[idx].required=e.target.checked; setNewEvent({...newEvent, formFields: nf})}} className="accent-[#C8102E] w-5 h-5 cursor-pointer" /> จำเป็นต้องตอบ
                                                                    </label>

                                                            </div>
