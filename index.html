                                                    })}
                                                </div>

                                                <div className="mt-6 flex flex-wrap gap-2">
                                                    <button onClick={()=>setNewEvent({...newEvent, formFields: [...(newEvent.formFields||[]), {id: Date.now(), label:'', type:'text', required:false, description:''}]})} className="flex-1 py-3 px-4 border-2 border-dashed border-gray-300 rounded-xl text-sm font-bold text-gray-600 hover:bg-white hover:border-[#C8102E] hover:text-[#C8102E] transition-all flex justify-center items-center gap-2 min-w-[150px]">
                                                        <i className="ph ph-plus-circle text-lg"></i> เพิ่มคำถาม
                                                    </button>
                                                    <button onClick={addSection} className="flex-1 py-3 px-4 bg-red-50 border border-red-200 rounded-xl text-sm font-bold text-[#C8102E] hover:bg-red-100 transition-all flex justify-center items-center gap-2 min-w-[150px]">
                                                        <i className="ph ph-columns text-lg"></i> แบ่งส่วน (หน้าใหม่)
                                                    </button>
                                                    <button onClick={addImageRef} className="flex-1 py-3 px-4 bg-blue-50 border border-blue-200 rounded-xl text-sm font-bold text-blue-600 hover:bg-blue-100 transition-all flex justify-center items-center gap-2 min-w-[150px]">
                                                        <i className="ph ph-image text-lg"></i> แทรกรูปอ้างอิง
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="flex gap-3 pt-6 border-t mt-6">
                                                <button onClick={()=>{setIsCreating(false); setIsEditing(false);}} className="w-1/3 py-4 bg-gray-100 rounded-xl font-bold text-gray-700 hover:bg-gray-200 transition-colors">ยกเลิก</button>
                                                <button onClick={handleSaveEvent} className="w-2/3 py-4 bg-[#C8102E] text-white rounded-xl font-bold shadow-md hover:bg-[#a10d25] flex justify-center items-center gap-2 transition-colors">
                                                    <i className="ph ph-floppy-disk text-lg"></i> บันทึกกิจกรรม
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* APPLICANTS TAB */}
                            {activeTab === 'applicants' && (
                                <div className="max-w-5xl mx-auto space-y-4 flex flex-col h-full animate-in fade-in">
                                    <div className="flex flex-col md:flex-row gap-3">
                                        <select value={selectedEventId} onChange={e=>setSelectedEventId(e.target.value)} className="p-3.5 border rounded-xl text-sm bg-white flex-1 outline-none focus:border-[#C8102E] shadow-sm font-bold appearance-none cursor-pointer">
                                            <option value="all">ดูรายชื่อผู้สมัครทุกกิจกรรม</option>
                                            {(events || []).map(e => <option key={e.id} value={e.id}>{e.title}</option>)}
                                        </select>
                                        <button onClick={exportCSV} className="bg-gray-800 text-white px-6 py-3.5 rounded-xl text-sm font-bold shadow-sm hover:bg-black transition-colors flex items-center justify-center gap-2">
                                            <i className="ph ph-download-simple text-lg"></i> Export CSV
                                        </button>
                                    </div>
                                    
                                    <div className="bg-white border rounded-2xl shadow-sm flex-1 overflow-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-gray-50 border-b sticky top-0 shadow-sm z-10"><tr className="text-gray-500"><th className="p-4 font-bold">ข้อมูลผู้สมัคร</th><th className="p-4 font-bold hidden md:table-cell">คำตอบอื่นๆ</th><th className="p-4 font-bold text-center">จัดการ</th></tr></thead>
                                            <tbody className="divide-y">
                                                {(applicants || []).filter(a => selectedEventId==='all' || a.eventId===selectedEventId).map(app => {
                                                    const answersArr = Object.entries(app.answers || {});
                                                    return (
                                                    <tr key={app.id} className="hover:bg-gray-50 relative group">
                                                        <td className="p-4 align-top">
                                                            <span className="font-bold text-gray-800 block text-base">{answersArr[0]?.[1] || 'ไม่ระบุชื่อ'}</span>
                                                            <span className="text-xs text-gray-400 mt-1 block">{app.timestamp}</span>
                                                            {selectedEventId === 'all' && <span className="text-[10px] bg-red-50 text-[#C8102E] px-2 py-0.5 rounded border border-red-100 mt-1 inline-block">{events?.find(e=>e.id===app.eventId)?.title}</span>}
                                                        </td>
                                                        <td className="p-4 hidden md:table-cell text-gray-600 text-xs space-y-1 align-top max-w-xs break-words">
                                                            {answersArr.slice(1).map(([k,v], idx) => {
                                                                const isFile = typeof v === 'string' && v.startsWith('http');
                                                                return <div key={idx}><span className="font-bold text-gray-500">{k}:</span> {isFile ? <a href={v} target="_blank" className="text-blue-500 hover:underline"><i className="ph ph-link"></i> ดูไฟล์แนบ</a> : Array.isArray(v) ? v.join(', ') : v}</div>
                                                            })}
                                                        </td>
                                                        <td className="p-4 text-center align-top">
                                                            <button onClick={() => handleDeleteApplicant(app.id)} className="w-10 h-10 rounded-full bg-white border shadow-sm text-gray-400 hover:text-red-500 hover:bg-red-50 hover:border-red-200 transition-colors flex items-center justify-center mx-auto" title="ลบข้อมูลนี้">
                                                                <i className="ph ph-trash text-lg"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                )})}
                                                {(!applicants || applicants.length === 0 || ((applicants || []).filter(a => selectedEventId==='all' || a.eventId===selectedEventId).length === 0)) && <tr><td colSpan="3" className="p-10 text-center text-gray-500">ไม่มีข้อมูลผู้สมัคร</td></tr>}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* SETTINGS TAB */}
                            {activeTab === 'settings' && (
                                <div className="max-w-2xl mx-auto animate-in fade-in space-y-6">
                                    <div className="bg-white border rounded-3xl p-6 md:p-8 shadow-sm">
                                        <h3 className="font-bold text-xl mb-6 text-gray-800 flex items-center gap-2"><i className="ph ph-lock-key text-[#C8102E]"></i> เปลี่ยนรหัสผ่านแอดมิน</h3>
                                        <form onSubmit={handleChangePassword} className="space-y-4">
                                            <div><label className="block text-sm font-bold text-gray-700 mb-1">รหัสผ่านเดิม</label><input type="password" value={passwords.oldPass} onChange={e=>setPasswords({...passwords, oldPass:e.target.value})} className="w-full border p-3 rounded-xl focus:border-[#C8102E] outline-none" required /></div>
                                            <div><label className="block text-sm font-bold text-gray-700 mb-1">รหัสผ่านใหม่ (8 หลัก)</label><input type="password" value={passwords.newPass} onChange={e=>setPasswords({...passwords, newPass:e.target.value})} className="w-full border p-3 rounded-xl focus:border-[#C8102E] outline-none" maxLength="8" required /></div>
                                            <button type="submit" className="w-full py-3.5 bg-gray-900 text-white rounded-xl font-bold shadow-md hover:bg-black mt-4 transition-colors">อัปเดตรหัสผ่าน</button>
                                        </form>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        function App() {
            const [currentView, setCurrentView] = useState('home');
            const [isAdminAuth, setIsAdminAuth] = useState(false);
            const [selectedEventSlug, setSelectedEventSlug] = useState(null);
            const [alertConfig, setAlertConfig] = useState({ isOpen: false, type: 'info', message: '' });
            
            const [isLoading, setIsLoading] = useState(true);
            const [isGlobalLoading, setGlobalLoading] = useState(false); 
            const [isLoginLoading, setIsLoginLoading] = useState(false); 
            
            const [events, setEvents] = useState([]);
            const [applicants, setApplicants] = useState([]);

            const showAlert = (message, type = 'info') => setAlertConfig({ isOpen: true, type, message });

            const fetchApi = async (payload = null) => {
                if (!GOOGLE_SCRIPT_URL.startsWith('http')) { showAlert('กรุณาใส่ GOOGLE_SCRIPT_URL ก่อนใช้งาน', 'error'); return {status:'error'}; }
                try {
                    const options = payload ? { method: 'POST', body: JSON.stringify(payload) } : { method: 'GET' };
                    const response = await fetch(payload ? GOOGLE_SCRIPT_URL : `${GOOGLE_SCRIPT_URL}?action=getData`, options);
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        if (!payload) { setEvents(data.events || []); setApplicants(data.applicants || []); } 
                        else { await fetchApi(); }
                    } 
                    return data;
                } catch (err) { console.error(err); showAlert('เกิดข้อผิดพลาดในการเชื่อมต่อฐานข้อมูล', 'error'); return { status: 'error' }; }
            };

            useEffect(() => {
                const init = async () => {
                    await fetchApi();
                    setIsLoading(false);
                    const slug = new URLSearchParams(window.location.search).get('event');
                    if (slug) { setSelectedEventSlug(slug); setCurrentView('event-detail'); }
                };
                init();
            }, []);

            const navigateTo = (view, slug = null) => {
                window.scrollTo(0, 0);
                setCurrentView(view);
                if (slug) { setSelectedEventSlug(slug); window.history.pushState({}, '', `?event=${slug}`); } 
                else { setSelectedEventSlug(null); window.history.pushState({}, '', window.location.pathname); }
            };

            const handleLogout = () => {
                setGlobalLoading(true);
                setTimeout(() => {
                    setIsAdminAuth(false);
                    setCurrentView('home');
                    setGlobalLoading(false);
                }, 500);
            };

            const handleAdminLogin = async (e, pwd) => {
                e.preventDefault();
                setIsLoginLoading(true); 
                const res = await fetchApi({ action: 'login', password: pwd });
                setIsLoginLoading(false);
                if (res.status === 'success') { setAlertConfig({isOpen:false}); setIsAdminAuth(true); setCurrentView('admin-dashboard'); } 
                else showAlert(res.message || 'รหัสผ่านไม่ถูกต้อง', 'error');
            };

            const handleRegisterSubmit = async (data) => {
                const now = new Date();
                const formattedDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                const eventTitle = events.find(e => e.id === data.eventId)?.title || '';

                const res = await fetchApi({ 
                    action: 'register', 
                    applicant: { 
                        id: `REG-${Date.now()}`, 
                        eventId: data.eventId, 
                        eventTitle: eventTitle, 
                        timestamp: formattedDate, 
                        answers: data.answers 
                    } 
                });
                if (res.status === 'success') navigateTo('success');
            };

            return (
                <div className="min-h-screen flex justify-center bg-gray-200 relative">
                    <div className={`bg-[#F3F4F6] min-h-screen flex flex-col shadow-2xl relative overflow-hidden transition-all duration-300 w-full`}>
                        {isGlobalLoading && (
                            <div className="absolute inset-0 bg-white/50 backdrop-blur-sm z-[999] flex flex-col items-center justify-center">
                                <i className="ph ph-spinner-gap animate-spin text-[#C8102E] text-5xl mb-4"></i>
                                <span className="text-gray-700 font-bold">กำลังประมวลผล...</span>
                            </div>
                        )}
                        {isLoading && !isGlobalLoading && <div className="absolute top-0 left-0 w-full h-1.5 bg-gray-200 z-[300] overflow-hidden"><div className="w-1/2 h-full bg-[#C8102E] animate-[slide_1.5s_ease-in-out_infinite] rounded-full"></div></div>}
                        
                        <CustomAlert config={alertConfig} onClose={() => setAlertConfig({ ...alertConfig, isOpen: false })} />

                        {currentView === 'admin-login' ? (
                            <div className="absolute inset-0 bg-[#F3F4F6] flex items-center justify-center p-4 z-[100]">
                                <div className="w-full max-w-sm bg-white p-8 rounded-3xl shadow-xl border text-center animate-in zoom-in-95">
                                    <img src={HARDCODED_LOGO} className="w-20 h-20 rounded-full mx-auto mb-6 border shadow-sm object-cover" />
                                    <h2 className="font-bold text-xl mb-2 text-gray-800">เข้าสู่ระบบผู้ดูแล</h2>
                                    <p className="text-sm text-gray-500 mb-8">กรอกรหัสผ่านเพื่อเข้าใช้งาน</p>
                                    
                                    <form onSubmit={(e) => handleAdminLogin(e, document.getElementById('pwdInput').value)}>
                                        <div className="relative h-14 flex items-center justify-center bg-gray-50 rounded-2xl border px-2 mb-6" onClick={() => document.getElementById('pwdInput')?.focus()}>
                                            <input id="pwdInput" name="pwd" type="password" maxLength={8} disabled={isLoginLoading} className="absolute inset-0 w-full h-full opacity-0 z-10 cursor-pointer disabled:cursor-not-allowed" onChange={(e)=>{
                                                const dots = document.querySelectorAll('.pwd-dot');
                                                dots.forEach((dot, i) => {
                                                    if(i < e.target.value.length) dot.classList.replace('bg-gray-300', 'bg-[#C8102E]');
                                                    else dot.classList.replace('bg-[#C8102E]', 'bg-gray-300');
                                                });
                                            }} />
                                            <div className="flex gap-3 pointer-events-none">
                                                {[...Array(8)].map((_, i) => <div key={i} className="pwd-dot w-3.5 h-3.5 rounded-full bg-gray-300 transition-colors duration-200"></div>)}
                                            </div>
                                        </div>
                                        <button type="submit" disabled={isLoginLoading} className="w-full bg-[#C8102E] text-white p-3.5 rounded-xl font-bold shadow-md hover:bg-[#a10d25] transition-colors disabled:bg-gray-400 flex items-center justify-center gap-2">
                                            {isLoginLoading ? <><i className="ph ph-spinner-gap animate-spin text-xl"></i> กำลังตรวจสอบ...</> : 'เข้าสู่ระบบ'}
                                        </button>
                                        <button type="button" onClick={()=>setCurrentView('home')} disabled={isLoginLoading} className="mt-4 text-sm font-medium text-gray-500 hover:text-gray-700 disabled:opacity-50">กลับหน้าหลัก</button>
                                    </form>
                                </div>
                            </div>
                        ) : isAdminAuth ? (
                            <AdminDashboard onLogout={handleLogout} events={events} applicants={applicants} showAlert={showAlert} fetchApi={fetchApi} setGlobalLoading={setGlobalLoading} />
                        ) : (
                            <>
                                <Header onAdminTrigger={() => setCurrentView('admin-login')} showBack={currentView === 'event-detail' || currentView === 'register'} onBack={() => currentView === 'register' ? navigateTo('event-detail', selectedEventSlug) : navigateTo('home')} />
                                <main className="flex-1 relative pb-safe">
                                    {currentView === 'home' && <HomeView navigateTo={navigateTo} events={events} isLoading={isLoading} />}
                                    {currentView === 'event-detail' && <EventDetailView event={events?.find(e=>e.slug===selectedEventSlug)} navigateTo={navigateTo} getApplicantCount={(id)=>applicants?.filter(a=>a.eventId===id).length||0} />}
                                    {currentView === 'register' && <RegisterView event={events?.find(e=>e.slug===selectedEventSlug)} navigateTo={navigateTo} onSubmit={handleRegisterSubmit} setGlobalLoading={setGlobalLoading} />}
                                    {currentView === 'success' && <SuccessRegistrationView navigateTo={navigateTo} />}
                                </main>
                            </>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
</body>
</html>
